<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피크민 데코 컬렉션</title>
<style>
  :root{
    --bg:#f5f2eb; --bg-elev:#ffffff; --text:#2b2b28; --text-dim:#7a756b;
    --border:#e4ded0; --accent:#3a9d5b; --accent-dim:#cfead9; --met:#c8961e; --pin:#3b82f6;
    --chip-off:#efece3; --chip-off-border:#d8d2c2;
    --danger:#c0392b; --shadow:0 1px 3px rgba(0,0,0,.08);
    --radius:14px; --modal-bg:#ffffff; --overlay:rgba(20,18,12,.45);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a17; --bg-elev:#252420; --text:#efece3; --text-dim:#a39c8c;
      --border:#3a372f; --accent:#4cbf76; --accent-dim:#1f3a2a; --met:#e0b64a; --pin:#5b9dff;
      --chip-off:#2c2a24; --chip-off-border:#413d33;
      --shadow:0 1px 3px rgba(0,0,0,.4); --modal-bg:#252420; --overlay:rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  body{padding-bottom:60px;}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;}
  h1{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
  h1 .title{display:flex;align-items:center;gap:8px;}
  h1 .emoji{font-size:22px;}
  #editToggle{border:1px solid var(--border);background:var(--bg-elev);color:var(--text-dim);
    border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;}
  #editToggle.on{background:var(--met);border-color:var(--met);color:#fff;}
  .statrow{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .statrow .label{font-size:11.5px;color:var(--text-dim);white-space:nowrap;min-width:76px;}
  .progress{flex:1;height:7px;border-radius:5px;background:var(--chip-off);overflow:hidden;}
  .progress > div{height:100%;background:var(--accent);border-radius:5px;transition:width .25s;}
  .progress.goal > div{background:var(--met);}
  .statrow .pct{font-size:11.5px;font-weight:600;color:var(--accent);min-width:60px;text-align:right;}
  .statrow.goal .pct{color:var(--met);}
  .totalPikminRow{font-size:11.5px;color:var(--text-dim);margin:2px 0 4px;}
  .totalPikminRow b{color:var(--text);font-weight:700;}
  .colorsummary{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px;margin-bottom:2px;-webkit-overflow-scrolling:touch;}
  .colorsummary::-webkit-scrollbar{display:none;}
  .cs-pill{flex:0 0 auto;border:1px solid var(--border);background:var(--bg-elev);border-radius:11px;
    padding:6px 9px;text-align:center;min-width:64px;position:relative;cursor:pointer;}
  .cs-pill.active{border-color:var(--accent);border-width:2px;padding:5px 8px;background:var(--accent-dim);}
  .cs-pill .sw{width:14px;height:14px;border-radius:50%;margin:0 auto 3px;}
  .cs-pill .n{font-size:13px;font-weight:700;}
  .cs-pill .k{font-size:9.5px;color:var(--text-dim);}
  .cs-pill .g{font-size:9px;color:var(--met);font-weight:700;margin-top:1px;}
  .cs-pill .dw{font-size:9px;color:var(--pin);font-weight:700;margin-top:1px;}
  .cs-pill .csDel{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:10px;line-height:16px;border:none;padding:0;}
  .cs-addpill{flex:0 0 auto;border:1px dashed var(--border);background:transparent;color:var(--text-dim);
    border-radius:11px;padding:6px 12px;font-size:18px;min-width:44px;}
  .tabs{display:flex;gap:6px;margin:8px 0;}
  .tab-btn{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);
    color:var(--text-dim);font-size:13.5px;font-weight:600;}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tabStats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:11.5px;
    color:var(--text-dim);background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;
    padding:6px 10px;margin-bottom:8px;}
  .tabStats b{color:var(--text);font-weight:700;}
  .tabStats .ts-deco{color:var(--accent);font-weight:700;}
  .tabStats .ts-wait{color:color-mix(in srgb, var(--met) 80%, var(--text-dim));font-weight:700;}
  .searchResultInfo{font-size:11px;color:var(--text-dim);text-align:center;margin-top:6px;}
  .dashboard{padding:4px 0 20px;grid-column:1/-1;}
  .dash-tablewrap{overflow-x:auto;margin-bottom:18px;border:1px solid var(--border);border-radius:10px;}
  .dash-table{border-collapse:collapse;width:100%;font-size:11.5px;white-space:nowrap;}
  .dash-table th, .dash-table td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);}
  .dash-table th:first-child, .dash-table td:first-child{text-align:left;position:sticky;left:0;
    background:var(--bg-elev);}
  .dash-table thead th{background:var(--bg-elev);font-weight:700;color:var(--text-dim);}
  .dash-sect td{background:color-mix(in srgb, var(--accent) 12%, var(--bg-elev));font-weight:700;
    color:var(--text);position:static;}
  .dash-label{color:var(--text-dim);}
  .dash-sum{font-weight:700;color:var(--text);}
  .dash-section-title{font-size:13px;font-weight:700;margin:14px 2px 6px;}
  .dash-listwrap{overflow-x:auto;margin-bottom:10px;border:1px solid var(--border);border-radius:10px;}
  .dash-list{border-collapse:collapse;width:100%;font-size:12px;}
  .dash-list th, .dash-list td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;
    white-space:nowrap;}
  .dash-empty{font-size:12px;color:var(--text-dim);padding:4px 2px 14px;}
  .dash-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;
    border:1px solid rgba(0,0,0,.15);vertical-align:middle;flex-shrink:0;}
  .dash-table thead th{white-space:nowrap;}
  .dash-dots{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;}
  .dash-cat{vertical-align:top;font-weight:700;color:var(--text);white-space:nowrap;}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .search{flex:1;min-width:110px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-elev);color:var(--text);font-size:14px;}
  .icon-btn{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);
    color:var(--text-dim);font-size:12.5px;white-space:nowrap;}
  .icon-btn.on{color:var(--accent);border-color:var(--accent);}
  main{padding:10px 12px 30px;display:flex;flex-direction:column;gap:10px;}
  /* 화면이 넓어지면 카테고리 카드를 최대 2열까지만 - 아이템 카드처럼 더 늘어나지
     않고 딱 2열에서 고정된다(3열 이상은 카드 하나가 너무 좁아져 오히려 안 좋음). */
  @media (min-width:700px){
    main{display:grid;grid-template-columns:repeat(2,1fr);align-items:start;}
  }
  .addLocBtn{display:block;width:100%;padding:10px;border-radius:12px;border:1px dashed var(--border);
    background:transparent;color:var(--text-dim);font-size:13px;grid-column:1/-1;}
  details.loc{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;}
  details.loc summary{list-style:none;cursor:pointer;padding:11px 14px;}
  details.loc summary::-webkit-details-marker{display:none;}
  .loc-row{display:flex;align-items:center;justify-content:space-between;gap:8px 6px;flex-wrap:wrap;}
  .loc-title{font-size:14.5px;font-weight:700;flex:1;min-width:60px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .loc-badge{font-size:13px;line-height:1;}
  details.loc.loc-complete{border-color:var(--accent);}
  details.loc.loc-complete .loc-title{color:var(--accent);}
  details.loc.loc-goalmet{border-color:var(--met);}
  details.loc.loc-goalmet .loc-title{color:var(--met);}
  details.loc.loc-pinned{border-color:color-mix(in srgb, var(--pin) 45%, var(--border));
    background:color-mix(in srgb, var(--pin) 5%, var(--bg-elev));}
  details.loc.loc-pinned .loc-title{color:color-mix(in srgb, var(--pin) 65%, var(--text));}
  .loc-meta{display:flex;align-items:center;gap:8px;}
  .loc-count{font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
  .chev{width:9px;height:9px;border-right:2px solid var(--text-dim);border-bottom:2px solid var(--text-dim);
    transform:rotate(-45deg);transition:transform .2s;margin-right:2px;flex-shrink:0;}
  details.loc[open] .chev{transform:rotate(45deg);}
  .loc-progress{height:4px;border-radius:3px;background:var(--chip-off);overflow:hidden;margin-top:9px;}
  .loc-progress > div{height:100%;background:var(--met);}
  details.loc[open] .loc-progress, details.loc.loc-complete .loc-progress{display:none;}
  .loc-almost{margin-top:8px;padding:6px 9px;border-radius:9px;font-size:11.5px;font-weight:700;
    background:color-mix(in srgb, var(--ac,var(--met)) 16%, transparent);
    color:color-mix(in srgb, var(--ac,var(--met)) 70%, var(--text));
    border:1px solid color-mix(in srgb, var(--ac,var(--met)) 45%, transparent);}
  .loc-almost b{text-decoration:underline;}
  .items{padding:4px 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;align-items:start;}
  .item{border:1px solid var(--border);border-radius:12px;padding:9px;background:var(--bg);position:relative;}
  .item.complete{border-color:var(--accent);}
  .item.goalmet{border-color:var(--met);background:linear-gradient(180deg,color-mix(in srgb,var(--met) 10%,transparent),transparent);}
  .item.rare-item{border-style:dashed;border-color:color-mix(in srgb, var(--pin) 55%, var(--border));}
  .rare-badge{border:1px solid color-mix(in srgb, var(--pin) 55%, var(--border));background:color-mix(in srgb, var(--pin) 12%, var(--bg-elev));
    color:color-mix(in srgb, var(--pin) 70%, var(--text));border-radius:8px;padding:2px 6px;font-size:10.5px;font-weight:700;}
  .rare-current{font-size:13px;margin-bottom:4px;}
  .rare-current b{color:var(--pin);}
  .quickadd-row{display:flex;gap:6px;margin:6px 0 4px;}
  .quickAddBtn{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--border);background:var(--bg-elev);
    color:var(--text);font-size:12.5px;font-weight:600;}
  .modal .row #fRareLevel{width:70px;flex-shrink:0;}
  .modal .row #fRareSnap{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elev);
    color:var(--text);font-size:12px;}
  .item-head{display:flex;align-items:center;gap:7px 6px;margin-bottom:7px;flex-wrap:wrap;}
  .waitItemBtn{flex-shrink:0;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-dim);
    border-radius:8px;padding:2px 5px;font-size:10.5px;line-height:1.3;font-weight:700;}
  .item-name{font-size:12.5px;font-weight:600;line-height:1.25;flex:1;min-width:60px;}
  .edit-btns{display:flex;gap:3px;}
  .edit-btns button{width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:var(--bg-elev);
    font-size:10px;padding:0;line-height:1;color:var(--text-dim);}
  .edit-btns button.del{color:var(--danger);border-color:var(--danger);}
  .pinGroupBtn.on{background:var(--met);border-color:var(--met);color:#fff;}
  .rareUnlockToggleBtn{width:auto!important;padding:0 6px;font-size:10px;white-space:nowrap;
    color:var(--text-dim);}
  .rareUnlockToggleBtn.on{background:color-mix(in srgb, var(--pin) 15%, var(--bg-elev));
    border-color:var(--pin);color:var(--pin);}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px;row-gap:12px;justify-items:center;}
  .chip{width:34px;height:34px;border-radius:10px;padding:3px;border:none;background:var(--chip-off-border);
    position:relative;}
  .chip-plus{display:block;width:100%;height:100%;background:transparent;border:none;padding:0;margin:0;
    cursor:pointer;-webkit-appearance:none;appearance:none;}
  .chip .inner{width:100%;height:100%;border-radius:7px;background:var(--chip-off);
    display:flex;align-items:center;justify-content:center;}
  .chip .dot{width:12px;height:12px;border-radius:50%;background:var(--dotcolor,#999);}
  .chip .n{position:absolute;bottom:-3px;right:-3px;background:var(--bg-elev);color:var(--text);
    font-size:9px;font-weight:800;border-radius:6px;min-width:14px;padding:0 2px;line-height:14px;
    border:1px solid var(--border);text-align:center;pointer-events:none;}
  .chip.cleared{background:var(--accent);}
  .chip.cleared .n{color:var(--accent);}
  .chip.met{background:var(--met);}
  .chip.met .n{background:var(--met);color:#fff;border-color:var(--met);}
  .chip-minus{position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;
    background:var(--bg-elev);color:var(--text-dim);border:1px solid var(--border);
    font-size:12px;line-height:1;padding:0;z-index:2;font-weight:700;-webkit-appearance:none;appearance:none;}
  .chip-minus:active{background:var(--danger);color:#fff;border-color:var(--danger);}
  .chip-idx{position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;
    background:var(--pin);color:#fff;font-size:8.5px;font-weight:800;line-height:14px;
    text-align:center;z-index:2;pointer-events:none;}
  .chip-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .chip-reorder{display:flex;gap:4px;}
  .chipMoveBtn{width:28px;height:26px;border-radius:7px;border:1px solid var(--border);
    background:var(--bg-elev);color:var(--text);font-size:15px;line-height:1;padding:0;
    font-weight:700;-webkit-appearance:none;appearance:none;touch-action:manipulation;}
  .chipMoveBtn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chipMoveBtn:disabled{opacity:.3;}
  .footnote{font-size:10px;color:var(--text-dim);text-align:center;margin:2px 0 8px;}
  footer.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-elev);border-top:1px solid var(--border);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:10;}
  footer.bar button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-size:12px;font-weight:600;}
  footer.bar button.danger{color:var(--danger);border-color:var(--danger);}
  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:30px 10px;grid-column:1/-1;}
  input[type=file]{display:none;}
  /* modal */
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;
    justify-content:center;}
  @media (min-width:560px){ .overlay{align-items:center;} }
  .modal{background:var(--modal-bg);width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;}
  @media (min-width:560px){ .modal{border-radius:16px;} }
  .modal h3{margin:0 0 12px;font-size:15px;}
  .modal label{display:block;font-size:12px;color:var(--text-dim);margin:10px 0 4px;}
  .modal input[type=text],.modal input[type=number]{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:14px;}
  .modal input[type=color]{width:44px;height:34px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--bg);}
  .modal .colorgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .modal .colorchoice{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:9px;
    padding:6px 9px;font-size:12.5px;background:var(--bg);}
  .modal .colorchoice .sw{width:12px;height:12px;border-radius:50%;}
  .modal .colorchoice input{margin:0;}
  .modal .colorTargetInput{display:none;width:34px;padding:2px 4px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg-elev);color:var(--text);font-size:12px;}
  .modal .customTargetsOn .colorTargetInput{display:inline-block;}
  .modal .customToggleRow{display:flex;align-items:flex-start;gap:7px;margin-top:10px;font-size:11.5px;
    color:var(--text-dim);line-height:1.4;}
  .modal .customToggleRow input{margin-top:2px;}
  .modal .waiting-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .modal .waiting-row{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--border);
    border-radius:9px;padding:6px 8px;background:var(--bg);}
  .modal .waiting-row .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .modal .waiting-row input{width:56px;margin-left:auto;padding:4px 6px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg-elev);color:var(--text);font-size:13px;text-align:right;}
  .modal .waiting-hint{font-size:11px;color:var(--text-dim);margin-top:10px;line-height:1.4;}
  .headcount-line{font-size:10.5px;color:var(--text-dim);white-space:nowrap;}
  .item .headcount-line{margin:-3px 0 6px;}
  summary .headcount-line{margin-top:2px;font-size:11px;}
  .hc-deco{color:var(--accent);font-weight:600;}
  .hc-wait{color:color-mix(in srgb, var(--met) 80%, var(--text-dim));font-weight:600;}
  .modal .row{display:flex;gap:8px;align-items:center;}
  .modal .actions{display:flex;gap:8px;margin-top:16px;}
  .modal .actions button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:13.5px;font-weight:600;}
  .modal .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal .actions button.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
</style>
</head>
<body>

<header>
  <h1>
    <span class="title"><span class="emoji">🌺</span>피크민 데코 컬렉션</span>
    <button id="editToggle">✏️ 편집</button>
  </h1>
  <div class="statrow">
    <span class="label">종류 보유</span>
    <div class="progress"><div id="existBar" style="width:0%"></div></div>
    <span class="pct" id="existPct">0/0</span>
  </div>
  <div class="statrow goal">
    <span class="label">5마리 달성</span>
    <div class="progress goal"><div id="goalBar" style="width:0%"></div></div>
    <span class="pct" id="goalPct">0/0</span>
  </div>
  <div class="totalPikminRow" id="totalPikminRow">총 보유 피크민 <b id="totalPikminText">0마리</b></div>
  <div class="colorsummary" id="colorSummary"></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="loc" id="tabLoc">위치별</button>
    <button class="tab-btn" data-tab="special" id="tabSpecial">스페셜</button>
    <button class="tab-btn" data-tab="dashboard" id="tabDashboard">현황판</button>
  </div>
  <div class="tabStats" id="tabStats"></div>
  <div class="toolbar" id="toolbarRow">
    <input class="search" id="search" type="search" placeholder="검색… (예: 빨강&클로버, !데코)">
    <button class="icon-btn" id="filterBtn">미완료만</button>
    <button class="icon-btn" id="expandBtn">모두 펼치기</button>
  </div>
  <div class="searchResultInfo" id="searchResultInfo" style="display:none;"></div>
</header>

<main id="main"></main>

<footer class="bar">
  <button id="exportBtn">📤 내보내기</button>
  <button id="importBtn">📥 가져오기</button>
  <button class="danger" id="resetBtn">초기화</button>
</footer>

<script>
(function(){
  "use strict";
  var DEFAULT_CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
  var CATALOG_KEY = 'pikminDecoCatalog_v2';
  var STATE_KEY = 'pikminDecoState_v2';

  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(prefix){
    return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  // 스페셜 데코는 원래 "카테고리 이름 = 데코 이름"이었던 항목들이라 (마리오 모자,
  // 화투(볼륨1) 등), 위치 탭처럼 데코 하나당 카테고리 하나로 나눠준다. 다중 세트로
  // 쪼갠 항목(예: "화투(볼륨1) #1"...)은 " #N" 접미사를 떼고 원래 이름으로 다시 묶는다.
  function regroupSpecialByName(items){
    var order = [];
    var map = {};
    (items || []).forEach(function(it){
      var base = it.name.replace(/ #\d+$/, '');
      if(!map[base]){ map[base] = []; order.push(base); }
      map[base].push(it);
    });
    return order.map(function(name){ return {id: uid('sg'), name: name, items: map[name]}; });
  }

  var CATALOG;
  try {
    var stored = localStorage.getItem(CATALOG_KEY);
    CATALOG = stored ? JSON.parse(stored) : deepClone(DEFAULT_CATALOG);
  } catch(e){ CATALOG = deepClone(DEFAULT_CATALOG); }
  if(!CATALOG.goal) CATALOG.goal = 5;
  if(!CATALOG.colors) CATALOG.colors = deepClone(DEFAULT_CATALOG.colors);
  if(!CATALOG.specialGroups){
    // first-time migration from the very original flat array
    CATALOG.specialGroups = regroupSpecialByName(CATALOG.special || []);
  } else if(CATALOG.specialGroups.length === 1 && CATALOG.specialGroups[0].id === 'sg-1' && CATALOG.specialGroups[0].name === '스페셜'){
    // one-time fix: an earlier version of this app lumped every special deco
    // into a single "스페셜" bucket - split it back into one category per deco.
    CATALOG.specialGroups = regroupSpecialByName(CATALOG.specialGroups[0].items);
  }
  // 일회성 정리: 예전에 이미지 표시 기능을 만들다가 완전히 뺐는데, 아이템마다
  // 들고 있던 이미지 경로 맵(images)은 그대로 남아 있었다. 화면엔 전혀 안
  // 쓰이면서 용량만 차지하고 내보내기(백업)에도 그대로 실리니 완전히 지운다.
  // 가져오기로 예전 백업을 불러올 때도 다시 필요하므로 함수로 빼둔다.
  function stripCatalogImages(){
    var stripped = false;
    CATALOG.locations.concat(CATALOG.specialGroups).forEach(function(g){
      g.items.forEach(function(it){
        if('images' in it){ delete it.images; stripped = true; }
      });
    });
    return stripped;
  }
  if(stripCatalogImages()) saveCatalog();

  var state = {};
  try { state = JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch(e){ state = {}; }
  // 예전(색상별 전역) 대기 피크민 기록은 아이템 단위 구조로 대체됐으니 정리한다
  (function(){
    var hadOld = false;
    Object.keys(state).forEach(function(k){ if(k.indexOf('waiting::')===0){ delete state[k]; hadOld = true; } });
    if(hadOld) try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){}
  })();
  // 일회성 마이그레이션: 색상별 클리어 조건(이제는 "분할 알 개수")이 지정된
  // 아이템은 예전엔 하나의 통합 카운트(0~조건×5)로 저장됐지만, 이제는 알마다
  // 별도 키(itemId::color::0, ::1 ...)로 나눠 관리한다. 기존 통합 값을 알
  // 하나당 최대 5개씩 순서대로 채워 옮겨준다. 앱 로드 시뿐 아니라 가져오기로
  // 예전 형식 백업을 불러올 때도 다시 필요하므로 함수로 빼둔다.
  function migrateSplitColorCombos(){
    var migrated = false;
    var goalUnit = CATALOG.goal || 5;
    allItemsFlat().forEach(function(it){
      if(!it.colorTargets) return;
      it.colors.forEach(function(c){
        var n = it.colorTargets[c] || 1;
        if(n <= 1) return;
        var oldKey = it.id + '::' + c;
        if(!(oldKey in state)) return;
        var oldVal = state[oldKey];
        delete state[oldKey];
        var remaining = oldVal;
        for(var i=0;i<n && remaining>0;i++){
          var put = Math.min(remaining, goalUnit);
          state[it.id + '::' + c + '::' + i] = put;
          remaining -= put;
        }
        migrated = true;
      });
    });
    if(migrated) saveState();
  }
  migrateSplitColorCombos();

  var curTab = 'loc';
  var onlyIncomplete = false;
  var searchTerm = '';
  var searchQuery = null; // parseSearchQuery(searchTerm)의 결과 - {ast, colors, displayMode} 또는 null
  var allOpen = false;
  var openGroupIds = {};
  var editMode = false;
  var colorFilter = null;

  function saveCatalog(){ try{ localStorage.setItem(CATALOG_KEY, JSON.stringify(CATALOG)); }catch(e){} }
  function saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){} }

  function colorMeta(key){
    for(var i=0;i<CATALOG.colors.length;i++) if(CATALOG.colors[i].key === key) return CATALOG.colors[i];
    return {key:key, hex:'#999999'};
  }
  function getCount(key){ return state[key] || 0; }
  function setCount(key, val){
    val = Math.max(0, Math.min(9999, val|0));
    if(val === 0) delete state[key]; else state[key] = val;
    saveState();
  }
  function comboKey(itemId, color){ return itemId + '::' + color; }
  // "분할 알 개수": 이 색상을 서로 다른 디자인 여러 개로 따로 추적할지 (기본 1개).
  // 예: 마작패 노랑에 2를 지정하면 노랑 알이 2개 생겨서 각각 독립적으로 관리된다.
  function splitCountFor(item, color){
    return (item && item.colorTargets && item.colorTargets[color]) || 1;
  }
  // 아이템의 색상들을 실제 추적 단위(콤보)로 펼친다. 분할 안 된 색상은 기존 키
  // (itemId::color) 그대로 콤보 1개, 분할된 색상은 itemId::color::0, ::1 ... 로
  // 나뉜 콤보 여러 개가 된다. 콤보 하나는 항상 클리어 1개 · 목표(5세트) CATALOG.goal개다.
  function comboToken(cb){ return cb.idx==null ? cb.color : (cb.color + '::' + cb.idx); }
  function itemCombos(item){
    var natural = [];
    item.colors.forEach(function(c){
      var n = splitCountFor(item, c);
      if(n <= 1){
        natural.push({color:c, idx:null, key: comboKey(item.id, c)});
      } else {
        for(var i=0;i<n;i++){
          natural.push({color:c, idx:i, key: comboKey(item.id, c) + '::' + i});
        }
      }
    });
    if(!item.comboOrder || !item.comboOrder.length) return natural;
    // 사용자가 편집모드에서 알끼리 순서를 직접 바꿔놨다면(item.comboOrder), 색상별로
    // 뭉쳐있지 않고 마작패 실물 패 순서처럼 색이 섞여도 그 순서를 그대로 따른다.
    // 색상 삭제·알 개수 변경 등으로 더는 존재하지 않는 토큰은 무시하고, comboOrder에
    // 없는 새 콤보는 뒤에 그대로 붙여서 자동으로 맞춰준다.
    var byToken = {};
    natural.forEach(function(cb){ byToken[comboToken(cb)] = cb; });
    var ordered = [], used = {};
    item.comboOrder.forEach(function(token){
      var cb = byToken[token];
      if(cb && !used[token]){ ordered.push(cb); used[token] = true; }
    });
    natural.forEach(function(cb){
      var token = comboToken(cb);
      if(!used[token]) ordered.push(cb);
    });
    return ordered;
  }
  // 색상 하나에 딸린 콤보 기록(분할 여부와 무관하게)을 전부 지운다 - 아이템/색상/
  // 카테고리 삭제나, 분할 알 개수 자체가 바뀌어 예전 기록이 새 구조와 안 맞을 때 사용.
  function deleteCombosForN(itemId, color, n){
    if(n <= 1){
      delete state[comboKey(itemId, color)];
    } else {
      for(var i=0;i<n;i++) delete state[comboKey(itemId, color) + '::' + i];
    }
  }
  // 희귀 짝 연동처럼 "이 색상의 대표 콤보 하나"가 필요할 때 - 분할 안 됐으면 그대로,
  // 분할됐으면 첫 번째 알을 대표로 삼는다.
  function primaryComboKeyFor(item, color){
    var n = splitCountFor(item, color);
    return n <= 1 ? comboKey(item.id, color) : comboKey(item.id, color) + '::0';
  }
  // 대기 중인 피크민은 이미 "어떤 카테고리의 어떤 데코"로 태어날지 정해져 있으므로,
  // 색상 하나에 뭉뚱그리지 않고 그 아이템(콤보)에 바로 묶어서 관리한다.
  // 위치 데코 제작 재료 개념이라 위치 탭 아이템에서만 관리한다.
  var WAIT_KEY = 'pikminDecoWait_v1';
  var waitState = {};
  try { waitState = JSON.parse(localStorage.getItem(WAIT_KEY) || '{}'); } catch(e){ waitState = {}; }
  function saveWaitState(){ try{ localStorage.setItem(WAIT_KEY, JSON.stringify(waitState)); }catch(e){} }
  function getWait(itemId, color){ return waitState[comboKey(itemId,color)] || 0; }
  function setWait(itemId, color, val){
    val = Math.max(0, Math.min(9999, val|0));
    var key = comboKey(itemId, color);
    if(val === 0) delete waitState[key]; else waitState[key] = val;
  }
  // 필터와 무관한 "진짜" 총합 - "데코"/"대기" 키워드가 이 아이템에 해당하는지
  // 판정할 때는 반드시 이 값을 써야 한다. 예를 들어 "!데코;빨강"(=대기;빨강)처럼
  // OR로 다른 색상과 묶였을 때, "빨강"쪽 색상 제한이 "대기" 판정에까지 새어들어가
  // (빨강이 없는 아이템은 대기가 있어도 걸러지는) 서로 다른 OR 가지끼리 엉키는
  // 문제를 막기 위함 - 판정은 항상 아이템의 실제 상태 기준이어야 한다.
  function itemWaitTotalRaw(item){
    return item.colors.reduce(function(s,c){ return s + getWait(item.id,c); }, 0);
  }
  function itemDecoTotalRaw(item){
    return itemCombos(item).reduce(function(s,cb){ return s + getCount(cb.key); }, 0);
  }
  // "데코"/"대기" 키워드 판정 전용 - 색상 카드 클릭(colorFilter)은 "화면 전체를
  // 이 색으로만 볼래"라는 전역 지정이라 판정에도 그대로 반영하지만, 검색어 자체
  // 안의 색상 키워드(예: "대기;빨강"의 "빨강")는 반영하지 않는다 - 안 그러면
  // OR로 묶인 서로 다른 가지끼리 판정이 새어들어간다(예: 빨강이 없는 아이템은
  // 대기가 있어도 걸러지는 문제).
  function itemWaitTotalForKeyword(item){
    if(colorFilter) return getWait(item.id, colorFilter);
    return itemWaitTotalRaw(item);
  }
  function itemDecoTotalForKeyword(item){
    var combos = itemCombos(item);
    if(colorFilter) combos = combos.filter(function(cb){ return cb.color === colorFilter; });
    return combos.reduce(function(s,cb){ return s + getCount(cb.key); }, 0);
  }
  // 색상 필터가 걸려 있으면 대기/데코 마릿수도 그 색만 세어준다 - 색상 카드를
  // 눌러서 필터링할 때 총 마릿수·대기 표시가 전체가 아니라 그 색 기준으로 보이도록.
  // 색상 카드 클릭(colorFilter)뿐 아니라 검색어 안의 색상 키워드(빨강;하양 등)로
  // 좁혀졌을 때도 카테고리·데코 카드에 찍히는 마릿수가 그 색들만의 합으로 보이게
  // colorPassesFilters로 판단한다. 아무 필터도 없으면 항상 통과라 원래(전체 합)
  // 그대로 - 검색이 끝나면 자동으로 원래 숫자로 돌아온다. (이건 "표시용" 숫자다 -
  // "데코"/"대기" 키워드 판정에는 위의 Raw 버전을 쓴다.)
  function itemWaitTotal(item){
    return item.colors.reduce(function(s,c){ return colorPassesFilters(c) ? s + getWait(item.id,c) : s; }, 0);
  }
  function itemDecoTotal(item){
    var combos = itemCombos(item).filter(function(cb){ return colorPassesFilters(cb.color); });
    return combos.reduce(function(s,cb){ return s + getCount(cb.key); }, 0);
  }
  // 스페셜(이벤트) 데코는 "대기" 개념이 없으니 총 마릿수만 보여준다. 검색어에
  // "데코"/"대기" 키워드가 쓰였으면(searchQuery.displayMode) 그 쪽만 표기한다.
  function itemHeadcountHtml(item, kind){
    var deco = itemDecoTotal(item);
    // 희귀 종류는 스페셜(이벤트)과 마찬가지로 "대기" 개념 자체가 없으니(항상 0)
    // 총 마릿수만 보여준다 - 의미 없는 "대기 0"을 굳이 표시하지 않는다.
    if(kind === 'special' || item.isRare){
      return '<div class="headcount-line">총 <span class="hc-deco">' + deco + '</span>마리</div>';
    }
    var wait = itemWaitTotal(item);
    var mode = searchQuery && searchQuery.displayMode;
    if(mode === 'deco') return '<div class="headcount-line">총 ' + (deco+wait) + '마리 <span class="hc-deco">데코 ' + deco + '</span></div>';
    if(mode === 'wait') return '<div class="headcount-line">총 ' + (deco+wait) + '마리 <span class="hc-wait">대기 ' + wait + '</span></div>';
    return '<div class="headcount-line">총 ' + (deco+wait) + '마리 <span class="hc-deco">데코 ' + deco + '</span> · <span class="hc-wait">대기 ' + wait + '</span></div>';
  }
  function groupHeadcountTotals(group){
    var deco=0, wait=0;
    group.items.forEach(function(it){
      deco += itemDecoTotal(it);
      wait += itemWaitTotal(it);
    });
    return {deco:deco, wait:wait, total:deco+wait};
  }
  function groupHeadcountHtml(group, kind){
    var t = groupHeadcountTotals(group);
    if(kind === 'special'){
      return '<div class="headcount-line">총 <span class="hc-deco">' + t.deco + '</span>마리</div>';
    }
    var mode = searchQuery && searchQuery.displayMode;
    if(mode === 'deco') return '<div class="headcount-line">총 ' + t.total + '마리 <span class="hc-deco">데코 ' + t.deco + '</span></div>';
    if(mode === 'wait') return '<div class="headcount-line">총 ' + t.total + '마리 <span class="hc-wait">대기 ' + t.wait + '</span></div>';
    return '<div class="headcount-line">총 ' + t.total + '마리 <span class="hc-deco">데코 ' + t.deco + '</span> · <span class="hc-wait">대기 ' + t.wait + '</span></div>';
  }
  function totalPikminCount(){
    var decorated = 0, waiting = 0;
    CATALOG.locations.forEach(function(l){
      l.items.forEach(function(it){
        itemCombos(it).forEach(function(cb){ decorated += getCount(cb.key); });
        it.colors.forEach(function(c){ waiting += getWait(it.id,c); });
      });
    });
    CATALOG.specialGroups.forEach(function(g){
      g.items.forEach(function(it){
        itemCombos(it).forEach(function(cb){ decorated += getCount(cb.key); });
      });
    });
    return {decorated:decorated, waiting:waiting, total:decorated+waiting};
  }
  function openItemWaitModal(item){
    var rows = item.colors.map(function(c){
      var meta = colorMeta(c);
      return '<div class="waiting-row"><span class="sw" style="background:' + meta.hex + '"></span>' + esc(c) +
        '<input type="number" min="0" inputmode="numeric" class="waitingInput" data-color="' + esc(c) + '" value="' + getWait(item.id,c) + '"></div>';
    }).join('');
    var body = '<div class="waiting-grid">' + rows + '</div>' +
      '<div class="waiting-hint">이 데코로 태어나기로 정해졌지만 아직 완성되지 않은, 색상별 대기 중 피크민 마릿수예요.</div>';
    openModal('대기 중 피크민 · ' + item.name, body, {
      okLabel: '저장',
      onSubmit: function(){
        document.querySelectorAll('.waitingInput').forEach(function(el){
          var v = parseInt(el.value, 10);
          setWait(item.id, el.getAttribute('data-color'), isNaN(v) ? 0 : v);
        });
        saveWaitState();
        render();
      }
    });
  }

  // ---------- 희귀 데코 피크민 (rare deco level) ----------
  // 카테고리(위치)별로 포인트가 쌓여 레벨이 오르는 인게임 시스템을 흉내낸다.
  // 레벨 2~4는 표에 나온 값, 5레벨부터는 매 레벨 5000P로 고정.
  var RARE_LEVEL_COSTS = {2:800, 3:1200, 4:3000};
  var RARE_LEVEL_DEFAULT_COST = 5000;
  // 앱에서 희귀 아이템 "등록/삭제"(칩 +/-)로 정산하는 기본 포인트 - 인게임 "선물 상자
  // 탐험 완료(+200)"에 대응. 실제 모종뽑기 포인트는 반영 못 하니, 필요하면 배지를
  // 눌러 직접 보정하면 된다.
  var RARE_POINT_PER_UNIT = 200;

  function rareCostForLevel(level){ return RARE_LEVEL_COSTS[level] || RARE_LEVEL_DEFAULT_COST; }
  function rareCumulativePoints(level){
    var total = 0;
    for(var l=2; l<=level; l++) total += rareCostForLevel(l);
    return total;
  }
  function rareLevelInfo(points){
    points = Math.max(0, points|0);
    var level = 1, remaining = points;
    while(true){
      var cost = rareCostForLevel(level+1);
      if(remaining >= cost){ remaining -= cost; level++; } else { break; }
    }
    var nextCost = rareCostForLevel(level+1);
    return {level:level, points:points, intoLevel:remaining, nextCost:nextCost, toNext: nextCost-remaining};
  }
  function rareKey(group){ return 'rare::' + group.id; }
  function getRarePoints(group){ return state[rareKey(group)] || 0; }
  function setRarePoints(group, val){
    val = Math.max(0, Math.min(999999, val|0));
    var key = rareKey(group);
    if(val === 0) delete state[key]; else state[key] = val;
    saveState();
  }
  // "다음 레벨까지 남은 포인트"를 사용자가 직접 편집했을 때, 내부적으로 계속 들고
  // 있는 누적 포인트로 역산한다. 0 이하로 내려가면(포인트를 다 채웠으면) 레벨업을
  // 몇 번이고 반영한다.
  function rarePointsFromRemaining(currentLevel, remaining){
    var level = currentLevel;
    var nextCost = rareCostForLevel(level+1);
    var into = nextCost - remaining;
    while(into >= nextCost){
      into -= nextCost;
      level++;
      nextCost = rareCostForLevel(level+1);
    }
    if(into < 0) into = 0;
    return rareCumulativePoints(level) + into;
  }
  // 대기 중인 피크민(비희귀 아이템만) 하나가 데코로 자라면 "큰 모종" 획득에 준하는
  // +200P로 어림잡아, 지금 대기 중인 걸 전부 소진하면 최대 몇 레벨까지 갈 수
  // 있는지 카드에서 미리 보여준다.
  var RARE_WAITING_POINT_ESTIMATE = 200;
  function groupWaitingTotal(group){
    var total = 0;
    group.items.forEach(function(it){
      if(it.isRare) return;
      it.colors.forEach(function(c){ total += getWait(it.id, c); });
    });
    return total;
  }
  function projectedRareInfo(group){
    var waitingCount = groupWaitingTotal(group);
    var bonus = waitingCount * RARE_WAITING_POINT_ESTIMATE;
    var projected = rareLevelInfo(getRarePoints(group) + bonus);
    return {waitingCount:waitingCount, bonus:bonus, level:projected.level, toNext:projected.toNext};
  }
  function rareBadgeHtml(group){
    var info = rareLevelInfo(getRarePoints(group));
    var proj = projectedRareInfo(group);
    var text = '🎁 Lv' + info.level + ' · ' + info.toNext + 'P';
    if(proj.level > info.level) text += ' (최소 Lv' + proj.level + ')';
    return '<button class="loc-badge rare-badge" data-group="' + group.id + '" title="다음 레벨까지 남은 포인트 · 탭해서 수정">' + text + '</button>';
  }
  function groupHasRare(group){ return group.items.some(function(it){ return it.isRare; }); }
  // 희귀 레벨은 "일반(비희귀) 데코 카테고리 완성" 후에만 해금된다 - 희귀 아이템
  // 자체는 이 판정에서 제외한다 (닭이 먼저냐 달걀이 먼저냐 문제 방지).
  function groupBaseComplete(group){
    // 카테고리 전체가 아니라, 실제로 희귀 짝이 있는 종류들만 완성되면 된다
    // (역/슈퍼마켓처럼 일부만 희귀가 있는 경우와 공원처럼 전부 있는 경우 둘 다 대응)
    var owned=0, total=0;
    group.items.forEach(function(it){
      if(it.isRare) return;
      if(!findRarePair(it, group)) return;
      itemCombos(it).forEach(function(cb){
        var n = getCount(cb.key);
        owned += Math.min(n, 1); total += 1;
      });
    });
    return total>0 && owned>=total;
  }
  // 희귀 등록으로 일반 데코 마릿수가 도로 줄어도(연동 감소) 한 번 해금된 희귀
  // 시스템은 계속 유지되도록 - 처음 완성됐을 때 한 번 켜지면 꺼지지 않는 플래그.
  function rareUnlockedKey(group){ return 'rareUnlocked::' + group.id; }
  function isRareUnlocked(group){
    if(state[rareUnlockedKey(group)]) return true;
    if(groupBaseComplete(group)){ state[rareUnlockedKey(group)] = true; saveState(); return true; }
    return false;
  }
  // 자동 판정과 무관하게 사용자가 직접 희귀 해금 상태를 켜고 끈다 - 게임사가 나중에
  // 색상을 추가해서(예: 얼음 피크민 후속 추가) 예전엔 완료됐던 카테고리가 자동
  // 판정상 다시 미완료로 보일 때 등의 예외 상황에 대한 수동 보정 수단.
  function toggleRareUnlock(group){
    var key = rareUnlockedKey(group);
    if(state[key]) delete state[key]; else state[key] = true;
    saveState();
    render();
  }
  function baseNameOf(name){ return name.replace(/\s*\(희귀\)\s*$/,'').trim(); }
  function findRarePair(item, group){
    if(!group) return null;
    var base = baseNameOf(item.name);
    return group.items.find(function(it){
      return it !== item && !!it.isRare !== !!item.isRare && baseNameOf(it.name) === base;
    }) || null;
  }
  function openRarePointsModal(group){
    var pts = getRarePoints(group);
    var info = rareLevelInfo(pts);
    var proj = projectedRareInfo(group);
    var body =
      '<div class="rare-current">현재 <b>Lv ' + info.level + '</b> · 다음 레벨까지 ' + info.toNext + 'P 남음</div>' +
      (proj.level > info.level ? '<div class="rare-current">🥚 대기 ' + proj.waitingCount + '마리를 전부 데코로 바꾸면 예상 최소 <b>Lv ' + proj.level + '</b></div>' : '') +
      '<label>다음 레벨까지 남은 포인트</label>' +
      '<div class="row"><input type="number" min="0" id="fRarePoints" value="' + info.toNext + '"></div>' +
      '<div class="quickadd-row">' +
        '<button type="button" class="quickAddBtn" data-add="5">−5</button>' +
        '<button type="button" class="quickAddBtn" data-add="10">−10</button>' +
        '<button type="button" class="quickAddBtn" data-add="100">−100</button>' +
      '</div>' +
      '<label>레벨로 맞추기</label>' +
      '<div class="row"><input type="number" min="1" id="fRareLevel" value="' + info.level + '">' +
        '<button type="button" id="fRareSnap">이 레벨로 설정</button></div>' +
      '<div class="waiting-hint">인게임처럼 "다음 레벨까지 남은 포인트"를 기준으로 입력해요. 포인트를 얻으면 이 숫자가 줄어들고, 0이 되면 레벨업 하는 방식이에요. 희귀 칩을 +/- 할 때마다(선물 상자 탐험 완료에 대응) 자동으로 ' + RARE_POINT_PER_UNIT + 'P씩 정산돼요.</div>';
    openModal('희귀 레벨 · ' + group.name, body, {
      okLabel: '저장',
      afterOpen: function(){
        document.querySelectorAll('.quickAddBtn').forEach(function(btn){
          btn.addEventListener('click', function(){
            var input = document.getElementById('fRarePoints');
            var v = (parseInt(input.value,10) || 0) - parseInt(btn.getAttribute('data-add'),10);
            input.value = v;
          });
        });
        document.getElementById('fRareSnap').addEventListener('click', function(){
          var lvl = parseInt(document.getElementById('fRareLevel').value, 10);
          if(isNaN(lvl) || lvl < 1) return;
          document.getElementById('fRarePoints').value = rareCostForLevel(lvl+1);
          document.getElementById('fRareLevel').setAttribute('data-target-level', lvl);
        });
      },
      onSubmit: function(){
        var lvlInput = document.getElementById('fRareLevel');
        var snappedLevel = lvlInput.getAttribute('data-target-level');
        var baseLevel = snappedLevel ? parseInt(snappedLevel,10) : info.level;
        var v = parseInt(document.getElementById('fRarePoints').value, 10);
        if(isNaN(v)) v = 0;
        setRarePoints(group, rarePointsFromRemaining(baseLevel, v));
        render();
      }
    });
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  // ---------- modal ----------
  function closeModal(){
    document.getElementById('modalRoot').innerHTML = '';
    // iOS Safari can deliver a "ghost" click to whatever element ends up
    // under the finger once this overlay disappears — if that happens to be
    // a details/summary, it would toggle it open/closed unintentionally.
    // Swallow just that (summary-targeted) click; leave other clicks alone
    // so a quick follow-up tap (e.g. another edit button) still works.
    var guard = function(e){
      if(!e.target.closest('summary')) return;
      if(e.target.closest('button')) return; // a real button click inside summary - its own handler manages this
      e.stopPropagation(); e.preventDefault();
    };
    document.addEventListener('click', guard, true);
    setTimeout(function(){ document.removeEventListener('click', guard, true); }, 400);
  }
  function openModal(titleText, bodyHtml, opts){
    opts = opts || {};
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="overlay" id="ovl"><div class="modal">' +
      '<h3>' + esc(titleText) + '</h3>' +
      '<div id="modalBody">' + bodyHtml + '</div>' +
      '<div class="actions">' +
        (opts.danger ? '<button id="mDel" class="danger">삭제</button>' : '') +
        '<button id="mCancel">취소</button>' +
        '<button id="mOk" class="primary">' + (opts.okLabel||'확인') + '</button>' +
      '</div></div></div>';
    document.getElementById('ovl').addEventListener('click', function(e){ if(e.target.id==='ovl') closeModal(); });
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('mOk').addEventListener('click', function(){
      if(opts.onSubmit) { var ok = opts.onSubmit(); if(ok !== false) closeModal(); }
    });
    if(opts.afterOpen) opts.afterOpen();
    if(opts.danger){
      document.getElementById('mDel').addEventListener('click', function(){
        if(opts.onDelete) opts.onDelete();
        closeModal();
      });
    }
  }

  function colorCheckboxesHtml(selectedKeys, targets){
    selectedKeys = selectedKeys || [];
    targets = targets || {};
    return '<div class="colorgrid">' + CATALOG.colors.map(function(c){
      var checked = selectedKeys.indexOf(c.key) !== -1 ? 'checked' : '';
      var tval = targets[c.key] || 1;
      return '<label class="colorchoice"><input type="checkbox" class="colorCb" value="' + esc(c.key) + '" ' + checked + '>' +
        '<span class="sw" style="background:' + c.hex + '"></span>' + esc(c.key) +
        '<input type="number" class="colorTargetInput" data-color="' + esc(c.key) + '" min="1" max="99" value="' + tval + '"></label>';

  function renameColorEverywhere(oldKey, newKey){
    if(oldKey === newKey) return;
    CATALOG.colors.forEach(function(c){ if(c.key===oldKey) c.key = newKey; });
    function fix(items){
      items.forEach(function(it){
        var idx = it.colors.indexOf(oldKey);
        if(idx !== -1) it.colors[idx] = newKey;
      });
    }
    CATALOG.locations.forEach(function(l){ fix(l.items); });
    CATALOG.specialGroups.forEach(function(g){ fix(g.items); });
    // migrate state + waiting-pikmin keys (both use the same itemId::color format)
    var newState = {};
    Object.keys(state).forEach(function(k){
      var parts = k.split('::');
      if(parts[1] === oldKey) parts[1] = newKey;
      newState[parts.join('::')] = state[k];
    });
    state = newState; saveState();
    var newWait = {};
    Object.keys(waitState).forEach(function(k){
      var parts = k.split('::');
      if(parts[1] === oldKey) parts[1] = newKey;
      newWait[parts.join('::')] = waitState[k];
    });
    waitState = newWait; saveWaitState();
  }
  function deleteColorEverywhere(key){
    CATALOG.colors = CATALOG.colors.filter(function(c){ return c.key !== key; });
    function fix(items){
      items.forEach(function(it){
        it.colors = it.colors.filter(function(c){ return c !== key; });
      });
    }
    CATALOG.locations.forEach(function(l){ fix(l.items); });
    CATALOG.specialGroups.forEach(function(g){ fix(g.items); });
    Object.keys(state).forEach(function(k){ if(k.split('::')[1] === key) delete state[k]; });
    Object.keys(waitState).forEach(function(k){ if(k.split('::')[1] === key) delete waitState[k]; });
    saveWaitState();
  }

  // 일부 스페셜 데코는 색상 하나당 여러 개의 서로 다른 디자인을 모아야 완성돼요

  // 디자인별 색상 구성 그대로 자동으로 나눠주는 1회성 도구.
  var MULTI_VARIANT_SPECIALS = {

  function findGroupAndListContainingName(name){
    var groups = CATALOG.locations.concat(CATALOG.specialGroups);
    for(var i=0;i<groups.length;i++){
      var idx = groups[i].items.findIndex(function(it){ return it.name === name; });
      if(idx !== -1) return {group:groups[i], idx:idx};
    }
    return null;
  }
  function splitMultiVariantSpecials(){
    var names = Object.keys(MULTI_VARIANT_SPECIALS).filter(function(name){
      return !!findGroupAndListContainingName(name);
    });
    if(!names.length){
      alert('나눌 항목을 찾지 못했어요. 이미 나눠져 있거나 이름이 바뀐 것 같아요.');
      return;
    }
    if(!confirm(names.join(', ') + '\n위 스페셜 데코를 색상별 여러 디자인으로 나눌까요?\n(해당 항목의 기존 보유 기록은 초기화돼요)')) return;
    names.forEach(function(name){
      var found = findGroupAndListContainingName(name);
      if(!found) return;
      var list = found.group.items;
      var idx = found.idx;
      var orig = list[idx];
      orig.colors.forEach(function(c){ deleteCombosForN(orig.id, c, splitCountFor(orig,c)); });
      var variants = MULTI_VARIANT_SPECIALS[name];
      var newItems = variants.map(function(colors, i){
        return {id: uid('U'), name: name + ' #' + (i+1), colors: colors.slice()};
      });
      list.splice.apply(list, [idx,1].concat(newItems));
    });
    saveCatalog(); saveState(); render();
  }
  function moveGroup(kind, group, dir){

  function findItemAndList(id){
    var found = null;
    CATALOG.locations.forEach(function(g){
      g.items.forEach(function(it){ if(it.id===id) found = {item:it, list:g.items, group:g, kind:'loc'}; });
    });
    if(!found){
      CATALOG.specialGroups.forEach(function(g){
        g.items.forEach(function(it){ if(it.id===id) found = {item:it, list:g.items, group:g, kind:'special'}; });
      });
