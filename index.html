  // 카테고리 클리어까지 정확히 몇 마리 남았는지, 마지막 하나면 어떤 색/아이템인지 찾는다
  var ALMOST_THRESHOLD = 3;
  function groupClearGap(group){
    var owned=0, total=0, missingMap={}, missingOrder=[];
    group.items.forEach(function(it){
      if(it.optional) return; // 획득 인정 안 함 - 없어도 카테고리 완료로 친다
      itemCombos(it).forEach(function(cb){
        var n = getCount(cb.key);
        var got = Math.min(n, 1);
        owned += got; total += 1;
        if(got < 1){
          var mkey = it.name + '|' + cb.color;
          if(!missingMap[mkey]){ missingMap[mkey] = {name: it.name, color: cb.color, deficit: 0}; missingOrder.push(mkey); }
          missingMap[mkey].deficit += 1;
        }
      });
    });
    var missingList = missingOrder.map(function(k){ return missingMap[k]; });
    var remaining = total - owned;
    var withinThreshold = remaining > 0 && remaining <= ALMOST_THRESHOLD;
    return {owned:owned, total:total, remaining:remaining, missing: withinThreshold ? missingList : null};
  }
  function almostBannerHtml(missingList){
    if(!missingList || !missingList.length) return '';
    var first = missingList[0];
    var meta = colorMeta(first.color);
    var parts = missingList.map(function(m){ return esc(m.color) + ' ' + esc(m.name) + ' ' + m.deficit + '마리'; });
    return '<div class="loc-almost" style="--ac:' + meta.hex + '">⚡ <b>' + parts.join(', ') + '</b> 모으면 완료!</div>';
  }

  // ---------- totals ----------
  function allItemsFlat(){
    var out = [];
    CATALOG.locations.concat(CATALOG.specialGroups).forEach(function(g){
      g.items.forEach(function(it){ out.push(it); });
    });
    return out;
  }
  // 콤보(아이템×색상, 분할된 색상은 알 하나하나가 콤보 하나) 단위로 합산한다.
  // 콤보 하나의 클리어 분모는 항상 1, 목표(5세트) 분모는 CATALOG.goal이다.
  // "종류 보유"는 콤보당 1마리, "5마리 달성"은 콤보당 CATALOG.goal마리를 채워야
  // 카운트된다 - 1마리만 모아서는 5마리 달성에 안 잡힌다.
  function comboTotals(){
    var existOwned=0, existTotal=0, goalOwned=0, goalTotal=0;
    allItemsFlat().forEach(function(it){
      itemCombos(it).forEach(function(cb){
        var n = getCount(cb.key);
        existOwned += Math.min(n, 1); existTotal += 1;
        goalOwned += (n>=CATALOG.goal ? 1 : 0); goalTotal += 1;
      });
    });
    return {existOwned:existOwned, existTotal:existTotal, goalOwned:goalOwned, goalTotal:goalTotal};
  }
  function colorTotals(){
    var map = {};
    CATALOG.colors.forEach(function(c){ map[c.key] = {heads:0, deco:0, wait:0, met:0, total:0}; });
    allItemsFlat().forEach(function(it){
      itemCombos(it).forEach(function(cb){
        var c = cb.color;
        if(!map[c]) map[c] = {heads:0, deco:0, wait:0, met:0, total:0};
        var n = getCount(cb.key);
        // 큰 숫자(heads)는 데코+대기를 합친 "총 보유", 작은 초록 글씨(met/total)는
        // 순수 데코 진행도, 맨 아래 줄(deco/wait)은 데코·대기 마릿수를 각각 보여준다.
        map[c].deco += n;
        map[c].met += Math.min(n, 1);
        map[c].total += 1;
      });
      // 대기(wait)는 분할 여부와 무관하게 색상당 하나라, 콤보가 아니라 색상 기준으로 한 번만 더한다
      it.colors.forEach(function(c){
        if(!map[c]) map[c] = {heads:0, deco:0, wait:0, met:0, total:0};
        map[c].wait += getWait(it.id, c);
      });
    });
    CATALOG.colors.forEach(function(c){ map[c.key].heads = map[c.key].deco + map[c.key].wait; });
    return map;
  }
  // 위치별/스페셜 탭 각각의 총 데코 수·활성화된 종류 수·(위치별만) 대기 수를 모은다.
  // 색상 필터가 걸려 있으면 그 색상만 집계한다(다른 표시들과 일관되게).
  function tabTotals(kind){
    var groups = kind === 'special' ? CATALOG.specialGroups : CATALOG.locations;
    var deco=0, wait=0, existOwned=0, existTotal=0;
    groups.forEach(function(g){
      g.items.forEach(function(it){
        itemCombos(it).forEach(function(cb){
          if(colorFilter && cb.color !== colorFilter) return;
          var n = getCount(cb.key);
          deco += n;
          existOwned += Math.min(n,1); existTotal += 1;
        });
        if(kind !== 'special'){
          it.colors.forEach(function(c){
            if(colorFilter && c !== colorFilter) return;
            wait += getWait(it.id, c);
          });
        }
      });
    });
    return {deco:deco, wait:wait, existOwned:existOwned, existTotal:existTotal};
  }

  // ---------- 현황판 ----------
  // 예전에 엑셀로 관리하던 "색상 x 지표" 요약표를 그대로 앱 안에 재현한다.
  // 위치(비희귀)/위치 희귀/이벤트(스페셜)/전체 4개 구간을 색상별로 집계.
  function allLocItems(){
    var out = [];
    CATALOG.locations.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  // "위치(희귀 포함)" 집계와는 별개로, 희귀 종류만 따로 떼서 참고용으로 보여주는
  // 섹션에 쓴다 - 전체 합계에는 중복으로 더하지 않는다(이미 위치 집계에 포함됨).
  function locRareItems(){
    var out = [];
    CATALOG.locations.forEach(function(g){ g.items.forEach(function(it){ if(it.isRare) out.push(it); }); });
    return out;
  }
  function specialAllItems(){
    var out = [];
    CATALOG.specialGroups.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function colorScopeTotals(items, includeWait){
    var map = {};
    CATALOG.colors.forEach(function(c){ map[c.key] = {deco:0, wait:0, met:0, total:0}; });
    items.forEach(function(it){
      itemCombos(it).forEach(function(cb){
        var c = cb.color;
        if(!map[c]) map[c] = {deco:0, wait:0, met:0, total:0};
        var n = getCount(cb.key);
        map[c].deco += n;
        map[c].met += Math.min(n,1);
        map[c].total += 1;
      });
      if(includeWait){
        it.colors.forEach(function(c){
          if(!map[c]) map[c] = {deco:0, wait:0, met:0, total:0};
          map[c].wait += getWait(it.id, c);
        });
      }
    });
    return map;
  }
  function mergeColorMaps(maps){
    var out = {};
    CATALOG.colors.forEach(function(c){ out[c.key] = {deco:0, wait:0, met:0, total:0}; });
    maps.forEach(function(m){
      CATALOG.colors.forEach(function(c){
        var k = c.key, src = m[k] || {};
        out[k].deco += src.deco||0; out[k].wait += src.wait||0;
        out[k].met += src.met||0; out[k].total += src.total||0;
      });
    });
    return out;
  }
  function pctStr(n, d){ return d ? (Math.round(n/d*1000)/10) + '%' : '0%'; }
  function dashNumRow(label, arr){
    var cells = arr.map(function(v){ return '<td>' + v + '</td>'; }).join('');
    var sum = arr.reduce(function(a,b){ return a+b; }, 0);
    return '<tr><td class="dash-label">' + esc(label) + '</td>' + cells + '<td class="dash-sum">' + sum + '</td></tr>';
  }
  function dashPctRow(label, metArr, totalArr){
    var cells = metArr.map(function(m,i){ return '<td>' + pctStr(m, totalArr[i]) + '</td>'; }).join('');
    var sumM = metArr.reduce(function(a,b){ return a+b; }, 0);
    var sumT = totalArr.reduce(function(a,b){ return a+b; }, 0);
    return '<tr><td class="dash-label">' + esc(label) + '</td>' + cells + '<td class="dash-sum">' + pctStr(sumM,sumT) + '</td></tr>';
  }
  function dashboardSection(title, map, opts){
    opts = opts || {};
    var keys = CATALOG.colors.map(function(c){ return c.key; });
    var deco = keys.map(function(k){ return (map[k]||{}).deco||0; });
    var wait = keys.map(function(k){ return (map[k]||{}).wait||0; });
    var met = keys.map(function(k){ return (map[k]||{}).met||0; });
    var total = keys.map(function(k){ return (map[k]||{}).total||0; });
    var head = deco.map(function(d,i){ return d+wait[i]; });
    var rows = '<tr class="dash-sect"><td colspan="' + (keys.length+2) + '">' + esc(title) + '</td></tr>';
    rows += dashNumRow('데코 피크민', deco);
    if(opts.showWait) rows += dashNumRow('일반 피크민(대기)', wait);
    rows += dashNumRow('활성화 종류 수', met);
    rows += dashNumRow('현존 종류 수', total);
    rows += dashPctRow('데코 진행도', met, total);
    // 대기가 없는 구간(희귀 등)은 "총 피크민"이 "데코 피크민"과 완전히 같은
    // 숫자라 굳이 또 한 줄 보여줄 필요가 없다 - opts.skipTotalRow로 생략.
    if(!opts.skipTotalRow) rows += dashNumRow(opts.totalLabel || '총 피크민', head);
    return rows;
  }
  // 색상 이름을 그냥 텍스트로 나열하면 밋밋하니, 실제 색상의 작은 알(원)로 보여준다.
  function colorDotHtml(color){
    var meta = colorMeta(color);
    return '<span class="dash-dot" style="background:' + meta.hex + '" title="' + esc(color) + '"></span>';
  }
  function itemMissingColors(item){
    // 화투·마작패처럼 색상 하나에 알이 여러 개(분할)인 아이템은 같은 색이 여러
    // 번 부족할 수 있는데, 여기서는 "어떤 색이 부족한지"만 보여주면 되니 중복은
    // 한 번으로 합친다 - 안 그러면 알이 우르르 나열돼 표가 지나치게 넓어진다.
    var missing = {};
    itemCombos(item).forEach(function(cb){ if(getCount(cb.key) < 1) missing[cb.color] = true; });
    return Object.keys(missing);
  }
  // 카테고리별로 "아직 완료 안 된 종류"를 하나하나 짚어서(카테고리는 rowspan으로
  // 한 번만) 그 종류에 부족한 색상을 알로 보여준다 - 카테고리 단위로 뭉뚱그리지
  // 않고 어떤 종류가 문제인지 바로 알 수 있게.
  function dashboardIncompleteRows(groups){
    var rows = '';
    groups.forEach(function(g){
      var gap = groupClearGap(g);
      if(!(gap.total>0 && gap.owned<gap.total)) return;
      var incompleteItems = g.items.filter(function(it){
        return !it.optional && itemMissingColors(it).length > 0;
      });
      if(!incompleteItems.length) return;
      incompleteItems.forEach(function(it, idx){
        rows += '<tr>' +
          (idx===0 ? '<td class="dash-cat" rowspan="' + incompleteItems.length + '">' + esc(g.name) + '</td>' : '') +
          '<td>' + esc(it.name) + '</td>' +
          '<td><span class="dash-dots">' + itemMissingColors(it).map(colorDotHtml).join('') + '</span></td>' +
          '</tr>';
      });
    });
    return rows;
  }
  function dashboardIncompleteHtml(){
    var locRows = dashboardIncompleteRows(CATALOG.locations);
    var specRows = dashboardIncompleteRows(CATALOG.specialGroups);
    var tableShell = function(rows){
      // 줄바꿈이 생기면 rowspan 셀과 옆 행 높이가 어긋나 보이니, 표는 한 줄
      // 고정(nowrap)으로 두고 좁은 화면에서는 가로 스크롤로 본다.
      return rows ? '<div class="dash-listwrap"><table class="dash-list"><thead><tr><th>카테고리</th><th>종류</th><th>부족 색상</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>' : '<div class="dash-empty">미완성 카테고리 없음 🎉</div>';
    };
    return '<div class="dash-section-title">미완성 카테고리 - 위치</div>' + tableShell(locRows) +
      '<div class="dash-section-title">미완성 카테고리 - 스페셜</div>' + tableShell(specRows);
  }
  function dashboardHtml(){
    var locMap = colorScopeTotals(allLocItems(), true);
    var rareMap = colorScopeTotals(locRareItems(), false);
    var specMap = colorScopeTotals(specialAllItems(), false);
    // 전체 합계는 위치(이미 희귀 포함)+이벤트만 더한다 - 희귀 참고 섹션을 또
    // 더하면 희귀가 두 번 잡히니 여기엔 안 넣는다.
    var allMap = mergeColorMaps([locMap, specMap]);
    var head = '<tr><th class="dash-label">구분</th>' + CATALOG.colors.map(function(c){
      return '<th>' + colorDotHtml(c.key) + esc(c.key) + '</th>';
    }).join('') + '<th>합</th></tr>';
    var body = dashboardSection('위치 (희귀 포함)', locMap, {showWait:true, totalLabel:'위치 총 피크민'}) +
      dashboardSection('위치(희귀)', rareMap, {showWait:false, skipTotalRow:true}) +
      dashboardSection('이벤트 (스페셜)', specMap, {showWait:false, totalLabel:'이벤트 총 피크민'}) +
      dashboardSection('전체 합계', allMap, {showWait:true, totalLabel:'전체 보유 피크민'});
    var tableHtml = '<div class="dash-tablewrap"><table class="dash-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    return '<div class="dashboard">' + tableHtml + dashboardIncompleteHtml() + '</div>';
  }

  function updateHeader(){
    var t = comboTotals();
    document.getElementById('existBar').style.width = (t.existTotal? t.existOwned/t.existTotal*100:0) + '%';
    document.getElementById('existPct').textContent = t.existOwned + '/' + t.existTotal;
    document.getElementById('goalBar').style.width = (t.goalTotal? t.goalOwned/t.goalTotal*100:0) + '%';
    document.getElementById('goalPct').textContent = t.goalOwned + '/' + t.goalTotal;

    var tp = totalPikminCount();
    document.getElementById('totalPikminText').textContent = tp.total + '마리 (데코 ' + tp.decorated + ' + 대기 ' + tp.waiting + ')';

    if(curTab !== 'dashboard'){
      var tt = tabTotals(curTab);
      document.getElementById('tabStats').innerHTML =
        '<span>총 데코 <b class="ts-deco">' + tt.deco + '</b>마리</span>' +
        '<span>활성화 종류 <b>' + tt.existOwned + '/' + tt.existTotal + '</b></span>' +
        (curTab === 'special' ? '' : '<span>대기 <b class="ts-wait">' + tt.wait + '</b>마리</span>');
    }

    var cm = colorTotals();
    var html = CATALOG.colors.map(function(c){
      var s = cm[c.key] || {heads:0,deco:0,wait:0,met:0,total:0};
      var active = colorFilter === c.key;
      return '<div class="cs-pill' + (active?' active':'') + '" data-color="' + esc(c.key) + '">' +
        (editMode ? '<button class="csDel" data-color="' + esc(c.key) + '">×</button>' : '') +
        '<div class="sw" style="background:' + c.hex + '"></div>' +
        '<div class="n">' + s.heads + '</div>' +
        '<div class="k">' + esc(c.key) + '</div>' +
        '<div class="g">' + s.met + '/' + s.total + '</div>' +
        '<div class="dw">' + s.deco + '/' + s.wait + '</div>' +
        '</div>';
    }).join('') + (editMode ? '<button class="cs-addpill" id="addColorBtn">+</button>' : '');
    document.getElementById('colorSummary').innerHTML = html;

    if(editMode){
      document.getElementById('addColorBtn').addEventListener('click', addColor);
      document.querySelectorAll('.csDel').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          editOrDeleteColor(btn.getAttribute('data-color'));
        });
      });
      document.querySelectorAll('.cs-pill').forEach(function(p){
        p.addEventListener('click', function(){ editOrDeleteColor(p.getAttribute('data-color')); });
      });
    } else {
      document.querySelectorAll('.cs-pill').forEach(function(p){
        p.addEventListener('click', function(){
          var color = p.getAttribute('data-color');
          colorFilter = (colorFilter === color) ? null : color;
          // 대기/데코 마릿수 표시도 필터 색상 기준으로 다시 그려야 하니 통째로 다시 렌더
          render();
        });
      });
    }
  }


  function chipHtml(combo, item){
    var key = combo.key;
    var n = getCount(key);
    var goal = CATALOG.goal;
    var meta = colorMeta(combo.color);
    var owned = n>0, cleared = n>=1, met = n>=goal;
    var pct = Math.min(n/goal,1);
    var bg = 'color-mix(in srgb, ' + meta.hex + ' ' + Math.round(10+pct*80) + '%, var(--chip-off))';
    var idxBadge = (combo.idx!=null) ? '<span class="chip-idx">' + (combo.idx+1) + '</span>' : '';
    return '<div class="chip' + (owned?' owned':'') + (cleared?' cleared':'') + (met?' met':'') +
      '" data-key="' + key + '" title="' + esc(combo.color) + '">' +
      (owned ? '<button class="chip-minus" data-key="' + key + '">−</button>' : '') +
      idxBadge +
      '<button class="chip-plus" data-key="' + key + '">' +
      '<span class="inner" style="background:' + (owned ? bg : 'var(--chip-off)') + '">' +
      '<span class="dot" style="--dotcolor:' + meta.hex + '"></span></span></button>' +
      '<span class="n">' + n + '/' + goal + '</span></div>';
  }

  function itemHtml(item, list, kind){
    var combos = itemCombos(item);
    var t = {owned:0,total:combos.length};
    combos.forEach(function(cb){ if(getCount(cb.key)>=1) t.owned++; });
    var allMet = combos.length>0 && combos.every(function(cb){ return getCount(cb.key)>=CATALOG.goal; });
    var complete = combos.length>0 && t.owned >= t.total;
    // 편집모드의 스페셜(이벤트) 탭에서는 칩마다 이전/다음 버튼(‹›)을 붙여서, 색상
    // 구분 없이 전체 칩 순서를 자유롭게 바꿀 수 있게 한다 - 마작패처럼 실물 패
    // 순서가 색상별로 뭉쳐 있지 않고 섞여 있을 때(빨강-노랑-보라-파랑-빨강 …) 그
    // 순서 그대로 맞추기 위함. 위치 데코는 이런 다중 디자인 개념이 없으니 필요 없다.
    var chips = combos.map(function(cb, pos){
      var chip = chipHtml(cb, item);
      if(!editMode || kind !== 'special') return chip;
      var canPrev = pos > 0, canNext = pos < combos.length-1;
      return '<div class="chip-wrap">' + chip + '<div class="chip-reorder">' +
        '<button class="chipMoveBtn" data-item-id="' + esc(item.id) + '" data-pos="' + pos + '" data-dir="-1" title="이전 칩과 순서 바꾸기"' + (canPrev?'':' disabled') + '>‹</button>' +
        '<button class="chipMoveBtn" data-item-id="' + esc(item.id) + '" data-pos="' + pos + '" data-dir="1" title="다음 칩과 순서 바꾸기"' + (canNext?'':' disabled') + '>›</button>' +
        '</div></div>';
    }).join('');
    var customBadge = item.colorTargets ? '<span class="loc-badge" title="색상별 알 개수 지정됨">🎯</span>' : '';
    var rareItemBadge = item.isRare ? '<span class="loc-badge" title="희귀 데코 - 같은 이름 일반 데코와 마릿수 연동">🎁</span>' : '';
    var optionalBadge = item.optional ? '<span class="loc-badge" title="획득 인정 안 함 - 없어도 카테고리 완료로 처리">🎫</span>' : '';
    var waitTotal = (kind==='loc' && !item.isRare) ? itemWaitTotal(item) : 0;
    var waitBtn = (kind==='loc' && !item.isRare) ? '<button class="waitItemBtn" data-item-id="' + item.id + '" title="대기 중인 피크민">🥚' +
      (waitTotal>0 ? waitTotal : '') + '</button>' : '';
    var editBtns = editMode ? '<div class="edit-btns"><button class="moveItemBtn" data-dir="-1">▲</button>' +
      '<button class="moveItemBtn" data-dir="1">▼</button><button class="editItemBtn">✏️</button>' +
      '<button class="dupItemBtn" title="복제">⧉</button></div>' : '';
    return '<div class="item' + (complete?' complete':'') + (allMet?' goalmet':'') + (item.isRare?' rare-item':'') + '" data-item-id="' + item.id + '" data-search="' +
      esc(item.name.toLowerCase()) + '" data-complete="' + (complete?'1':'0') + '" data-colors="' +
      esc(item.colors.join(' ')) + '">' +
      '<div class="item-head"><div class="item-name">' + esc(item.name) + customBadge + rareItemBadge + optionalBadge + '</div>' + waitBtn + editBtns + '</div>' +
      itemHeadcountHtml(item, kind) +
      '<div class="chips">' + chips + '</div></div>';
  }

  function groupSectionHtml(group, kind){
    var gap = groupClearGap(group);
    var owned = gap.owned, total = gap.total;
    var goalTotal=0, met=0;
    group.items.forEach(function(it){
      if(it.optional) return;
      itemCombos(it).forEach(function(cb){
        var n = getCount(cb.key);
        met += (n>=CATALOG.goal ? 1 : 0); goalTotal += 1;
      });
    });
    var pct = total? Math.round(owned/total*100):0;
    var complete = total>0 && owned>=total;
    var goalComplete = goalTotal>0 && met>=goalTotal;
    var badge = goalComplete ? '<span class="loc-badge completion-badge gold" title="전 조합 5마리 달성">🏅</span>'
      : (complete ? '<span class="loc-badge completion-badge" title="전 종류 보유">✅</span>' : '');
    var pinBadge = (kind==='special' && group.pinned) ? '<span class="loc-badge pin-badge" title="상단 고정됨">📌</span>' : '';
    var hasRare = kind==='loc' && groupHasRare(group) && isRareUnlocked(group);
    var rareBadge = hasRare ? rareBadgeHtml(group) : '';
    var almost = kind==='loc' ? almostBannerHtml(gap.missing) : '';
    var itemsHtml = group.items.map(function(it){ return itemHtml(it, group.items, kind); }).join('');
    var addBtn = editMode ? '<button class="addItemBtn" data-group="' + group.id + '" data-kind="' + kind + '" style="margin:4px 10px 8px;padding:8px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--text-dim);font-size:12px;width:calc(100% - 20px);">+ 아이템 추가</button>' : '';
    var pinBtn = (editMode && kind==='special') ? '<button class="pinGroupBtn' + (group.pinned?' on':'') + '" data-group="' + group.id + '" title="상단 고정">📌</button>' : '';
    // 자동 판정(비희귀 종류 전부 완료)과 무관하게 희귀 해금 표시를 수동으로 켜고 끌 수 있는
    // 버튼 - 게임사가 나중에 색상을 추가해서 예전엔 완료됐던 카테고리가 자동 판정상
    // 다시 미완료로 보일 때(신규 색상을 아직 못 모았을 때) 등의 예외 상황을 위한 보험.
    var rareToggleBtn = (editMode && kind==='loc' && groupHasRare(group)) ?
      '<button class="rareUnlockToggleBtn' + (isRareUnlocked(group)?' on':'') + '" data-group="' + group.id + '" title="희귀 해금 상태 수동 전환">' +
      (isRareUnlocked(group) ? '🎁 해금됨' : '🎁 해금 안됨') + '</button>' : '';
    var editGroupBtn = editMode ? '<div class="edit-btns">' + pinBtn + rareToggleBtn + '<button class="moveGroupBtn" data-group="' + group.id + '" data-kind="' + kind + '" data-dir="-1">▲</button>' +
      '<button class="moveGroupBtn" data-group="' + group.id + '" data-kind="' + kind + '" data-dir="1">▼</button>' +
      '<button class="editGroupBtn" data-group="' + group.id + '" data-kind="' + kind + '">✏️</button></div>' : '';
    var isPinned = kind==='special' && !!group.pinned;
    return '<details class="loc' + (complete?' loc-complete':'') + (goalComplete?' loc-goalmet':'') + (isPinned?' loc-pinned':'') + '" data-group-id="' + group.id + '" data-kind="' + kind + '"' + (openGroupIds[group.id]?' open':'') + '>' +
      '<summary><div class="loc-row"><div class="loc-title">' + esc(group.name) + pinBadge + badge + rareBadge + '</div>' +
      '<div class="loc-meta">' + editGroupBtn + '<span class="loc-count">' + owned + '/' + total + '</span><span class="chev"></span></div>' +
      '</div>' + groupHeadcountHtml(group, kind) + almost + '<div class="loc-progress"><div style="width:' + pct + '%"></div></div></summary>' +
      '<div class="items">' + itemsHtml + '</div>' + addBtn + '</details>';
  }

  function render(){
    var main = document.getElementById('main');
    // remember which sections are currently open/closed before rebuilding the DOM,
    // so edits/reorders/adds don't collapse sections the user had open
    main.querySelectorAll('details.loc').forEach(function(d){
      openGroupIds[d.getAttribute('data-group-id')] = d.open;
    });
    document.getElementById('editToggle').classList.toggle('on', editMode);
    // 현황판 탭은 검색/필터가 적용되는 목록이 아니라 통계 요약이라, 그 UI들을
    // 숨기고 별도 렌더 경로로 빠진다.
    document.getElementById('toolbarRow').style.display = curTab === 'dashboard' ? 'none' : '';
    document.getElementById('tabStats').style.display = curTab === 'dashboard' ? 'none' : '';
    document.getElementById('searchResultInfo').style.display = curTab === 'dashboard' ? 'none' : (document.getElementById('searchResultInfo').style.display);
    if(curTab === 'dashboard'){
      main.innerHTML = dashboardHtml();
      updateHeader();
      return;
    }
    var kind = curTab === 'loc' ? 'loc' : 'special';
    var groups = groupsFor(kind);
    if(kind === 'special'){
      // 고정된 카테고리(최대 3개)를 원래 순서는 유지한 채 맨 위로
      groups = groups.slice().sort(function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0); });
    }
    var html = groups.map(function(g){ return groupSectionHtml(g, kind); }).join('');
    if(editMode){
      var addLabel = kind === 'special' ? '+ 스페셜 카테고리 추가' : '+ 위치(카테고리) 추가';
      html += '<button class="addLocBtn" id="addGroupBtn">' + addLabel + '</button>';
      if(kind === 'special'){
        html += '<button class="addLocBtn" id="splitMultiBtn" style="margin-top:6px;">🎴 색상당 여러 디자인 필요한 데코 자동 분리 (화투·마작패·트럼프·체스말)</button>';
      }
    }
    main.innerHTML = html || '<div class="empty">항목이 없습니다.</div>';
    if(editMode){
      var addGroupBtn = document.getElementById('addGroupBtn');
      if(addGroupBtn) addGroupBtn.addEventListener('click', function(){ addGroup(kind); });
      var splitMultiBtn = document.getElementById('splitMultiBtn');
      if(splitMultiBtn) splitMultiBtn.addEventListener('click', splitMultiVariantSpecials);
      main.querySelectorAll('.dupItemBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var id = btn.closest('.item').getAttribute('data-item-id');
          var found = findItemAndList(id);
          if(found) duplicateItem(found.item, found.list);
        });
      });
      main.querySelectorAll('.addItemBtn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var k = btn.getAttribute('data-kind');
          var arr = groupsFor(k);
          var group = arr.find(function(g){ return String(g.id) === btn.getAttribute('data-group'); });
          addItem(group.items, k);
        });
      });
      main.querySelectorAll('.editGroupBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var k = btn.getAttribute('data-kind');
          var arr = groupsFor(k);
          var group = arr.find(function(g){ return String(g.id) === btn.getAttribute('data-group'); });
          editOrDeleteGroup(k, group);
        });
      });
      main.querySelectorAll('.pinGroupBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var group = CATALOG.specialGroups.find(function(g){ return String(g.id) === btn.getAttribute('data-group'); });
          if(group) togglePinGroup(group);
        });
      });
      main.querySelectorAll('.rareUnlockToggleBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var group = CATALOG.locations.find(function(g){ return String(g.id) === btn.getAttribute('data-group'); });
          if(group) toggleRareUnlock(group);
        });
      });
      main.querySelectorAll('.moveGroupBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var k = btn.getAttribute('data-kind');
          var arr = groupsFor(k);
          var group = arr.find(function(g){ return String(g.id) === btn.getAttribute('data-group'); });
          moveGroup(k, group, parseInt(btn.getAttribute('data-dir'),10));
        });
      });
      main.querySelectorAll('.editItemBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var id = btn.closest('.item').getAttribute('data-item-id');
          var found = findItemAndList(id);
          if(found) editOrDeleteItem(found.item, found.list, found.kind);
        });
      });
      main.querySelectorAll('.moveItemBtn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var id = btn.closest('.item').getAttribute('data-item-id');
          var found = findItemAndList(id);
          if(found) moveItem(found.item, found.list, parseInt(btn.getAttribute('data-dir'),10));
        });
      });
    }
    main.querySelectorAll('.waitItemBtn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var found = findItemAndList(btn.getAttribute('data-item-id'));
        if(found) openItemWaitModal(found.item);
      });
    });
    main.querySelectorAll('.rare-badge').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var group = CATALOG.locations.find(function(g){ return String(g.id) === btn.getAttribute('data-group'); });
        if(group) openRarePointsModal(group);
      });
    });
    applyFilters();
    updateHeader();
  }

  // ---------- 검색어 질의 언어 ----------
  // 연산자: & AND, ; OR, ! NOT, ( ) 그룹(우선연산), = 앞에 붙이면 그 항목을 완전일치로.
  // 우선순위는 일반적인 불리언 표기와 같이 NOT > AND > OR - 괄호로 얼마든지 뒤집을 수 있다.
  // 키워드: 카테고리명/데코명은 부분일치, 색상 이름은 카탈로그 색상과 완전일치일 때만
  // 색상으로 인식, "데코"/"대기"는 예약어로 각각 데코·대기 마릿수 유무를 뜻한다.
  function tokenizeQuery(str){
    var tokens = [];
    var i = 0;
    while(i < str.length){
      var c = str[i];
      if(c === '&' || c === ';' || c === '!' || c === '(' || c === ')'){
        tokens.push({type:c});
        i++;
      } else {
        var j = i;
        while(j < str.length && '&;!()'.indexOf(str[j]) === -1) j++;
        var raw = str.slice(i,j).trim();
        if(raw) tokens.push({type:'TERM', value:raw});
        i = j;
      }
    }
    return tokens;
  }
  function parseQueryAst(str){
    var tokens = tokenizeQuery(str);
    var pos = 0;
    function peek(){ return tokens[pos]; }
    function next(){ return tokens[pos++]; }
    function parseOr(){
      var node = parseAnd();
      while(peek() && peek().type === ';'){ next(); node = {op:'OR', left:node, right:parseAnd()}; }
      return node;
    }
    function parseAnd(){
      var node = parseNot();
      while(peek() && peek().type === '&'){ next(); node = {op:'AND', left:node, right:parseNot()}; }
      return node;
    }
    function parseNot(){
      if(peek() && peek().type === '!'){ next(); return {op:'NOT', operand:parseNot()}; }
      return parseAtom();
    }
    function parseAtom(){
      var tok = peek();
      if(!tok) return {op:'TERM', value:'', exact:false};
      if(tok.type === '('){
        next();
        var inner = parseOr();
        if(peek() && peek().type === ')') next();
        return inner;
      }
      if(tok.type === 'TERM'){
        next();
        var v = tok.value, exact = false;
        if(v.charAt(0) === '='){ exact = true; v = v.slice(1).trim(); }
        return {op:'TERM', value:v, exact:exact};
      }
      next(); // 피연산자 없는 연산자 - 그냥 건너뛴다
      return {op:'TERM', value:'', exact:false};
    }
    return parseOr();
  }
  function isColorTermValue(v){ return CATALOG.colors.some(function(c){ return c.key === v; }); }
  // node가 색상 항목들로만 이루어진 AND/OR 트리(예: 노랑, 노랑;빨강, (노랑&빨강))면
  // 그 색상 배열을 반환하고, 색상이 아닌 다른 항목이 하나라도 섞여 있으면 null을
  // 반환한다 - "!(노랑;빨강)"처럼 괄호로 묶인 색상 여러 개의 부정도 "이 색들만
  // 빼고 보여달라"는 뜻으로 알아채기 위한 판별기.
  function pureColorTermsIn(node){
    if(!node) return null;
    if(node.op === 'TERM') return isColorTermValue(node.value) ? [node.value] : null;
    if(node.op === 'AND' || node.op === 'OR'){
      var l = pureColorTermsIn(node.left), r = pureColorTermsIn(node.right);
      if(l === null || r === null) return null;
      return l.concat(r);
    }
    return null; // NOT나 그 외는 순수 색상 트리로 치지 않는다
  }
  // "!데코"는 "대기"와, "!대기"는 "데코"와 완전히 같은 뜻으로 쓰기로 했으므로
  // 평가/힌트 수집 전에 미리 그 형태로 통째로 바꿔둔다(중첩된 괄호 안에 있어도
  // 자식부터 정규화하면 자연히 걸러진다).
  function normalizeQueryAst(node){
    if(!node) return node;
    if(node.op === 'NOT'){
      var operand = normalizeQueryAst(node.operand);
      if(operand.op === 'TERM' && operand.value === '데코') return {op:'TERM', value:'대기', exact:false};
      if(operand.op === 'TERM' && operand.value === '대기') return {op:'TERM', value:'데코', exact:false};
      return {op:'NOT', operand:operand};
    }
    if(node.op === 'AND' || node.op === 'OR'){
      return {op:node.op, left:normalizeQueryAst(node.left), right:normalizeQueryAst(node.right)};
    }
    return node;
  }
  function queryTermMatches(term, item, group){
    var v = term.value;
    if(!v) return true;
    if(v === '데코') return itemDecoTotalForKeyword(item) > 0;
    if(v === '대기') return itemWaitTotalForKeyword(item) > 0;
    if(isColorTermValue(v)){
      return item.colors.indexOf(v) !== -1;
    }
    var vLower = v.toLowerCase();
    var groupName = (group.name || '').toLowerCase();
    var itemName = (item.name || '').toLowerCase();
    if(term.exact) return groupName === vLower || itemName === vLower;
    return groupName.indexOf(vLower) !== -1 || itemName.indexOf(vLower) !== -1;
  }
  function evalQueryAst(node, item, group){
    if(!node) return true;
    switch(node.op){
      case 'AND': return evalQueryAst(node.left,item,group) && evalQueryAst(node.right,item,group);
      case 'OR': return evalQueryAst(node.left,item,group) || evalQueryAst(node.right,item,group);
      case 'NOT':
        // "!색상" 및 "!(색상;색상&...)"은 필터링에는 영향을 주지 않는다 - 그
        // 색(들)만 빼고 다른 색 칩들을 보여달라는 "표시 범위" 지정일 뿐, "이
        // 색이 없는 카테고리를 보여달라"는 뜻이 아니기 때문(데코/대기는 위에서
        // 이미 반대 키워드로 치환돼 여기 안 옴).
        if(pureColorTermsIn(node.operand) !== null) return true;
        return !evalQueryAst(node.operand, item, group);
      default: return queryTermMatches(node, item, group);
    }
  }
  // 질의문에 등장한 색상(긍정/부정 따로)과 데코/대기 키워드를 모아서 칩 표시
  // 범위 좁히기와 마릿수 표기 모드 결정에 쓴다.
  function collectQueryHints(node, includeColors, excludeColors, modes){
    if(!node) return;
    if(node.op === 'NOT'){
      var negColors = pureColorTermsIn(node.operand);
      if(negColors) negColors.forEach(function(c){ excludeColors[c] = true; });
      // 그 외(카테고리명 등)의 부정은 칩/표기 힌트에 영향 없음
      return;
    }
    if(node.op === 'AND' || node.op === 'OR'){
      collectQueryHints(node.left, includeColors, excludeColors, modes);
      collectQueryHints(node.right, includeColors, excludeColors, modes);
      return;
    }
    if(node.value === '데코') modes.deco = true;
    else if(node.value === '대기') modes.wait = true;
    else if(isColorTermValue(node.value)) includeColors[node.value] = true;
  }
  function parseSearchQuery(str){
    str = (str || '').trim();
    if(!str) return null;
    var ast;
    try { ast = normalizeQueryAst(parseQueryAst(str)); } catch(e){ return null; }
    var includeColors = {}, excludeColors = {}, modes = {deco:false, wait:false};
    collectQueryHints(ast, includeColors, excludeColors, modes);
    var displayMode = (modes.deco && !modes.wait) ? 'deco' : (modes.wait && !modes.deco ? 'wait' : null);
    return {ast:ast, includeColors:includeColors, excludeColors:excludeColors, displayMode:displayMode};
  }
  // 색상 필터(카드 클릭)와 검색어 안의 색상 키워드(긍정/부정)를 모두 반영해
  // 특정 색이 지금 "보여줄 대상"인지 판단한다 - 칩 표시 좁히기와 필터링된
  // 마릿수 집계 양쪽에서 같이 쓴다.
  function colorPassesFilters(color){
    if(colorFilter && color !== colorFilter) return false;
    if(searchQuery){
      if(Object.keys(searchQuery.includeColors).length && !searchQuery.includeColors[color]) return false;
      if(searchQuery.excludeColors[color]) return false;
    }
    return true;
  }

  function applyFilters(){
    var main = document.getElementById('main');
    searchQuery = parseSearchQuery(searchTerm);
    var anyFilterActive = !!(searchTerm || onlyIncomplete || colorFilter);
    var matchedGroupCount = 0, filteredDeco = 0, filteredWait = 0;
    main.querySelectorAll('.item').forEach(function(el){
      var found = findItemAndList(el.getAttribute('data-item-id'));
      var matchesSearch = !searchQuery || (found && evalQueryAst(searchQuery.ast, found.item, found.group));
      var matchesIncomplete = !onlyIncomplete || el.getAttribute('data-complete') === '0';
      var colors = el.getAttribute('data-colors') || '';
      var matchesColor = !colorFilter || (' ' + colors + ' ').indexOf(' ' + colorFilter + ' ') !== -1;
      var visible = matchesSearch && matchesIncomplete && matchesColor;
      el.style.display = visible ? '' : 'none';
      // 색상 필터(카드 클릭) 및 검색어 안의 색상 키워드(긍정=이 색만, 부정=이
      // 색만 빼고) - 그 아이템 안에서 어떤 색 칩을 보여줄지 결정한다
      el.querySelectorAll('.chip').forEach(function(chip){
        chip.style.display = colorPassesFilters(chip.getAttribute('title')) ? '' : 'none';
      });
      // itemDecoTotal/itemWaitTotal도 이제 같은 colorPassesFilters를 쓰므로,
      // 카드 표기(headcount)와 전체 집계(filteredDeco/Wait)가 항상 같은 숫자를
      // 본다 - 필터가 없으면 자동으로 원래(전체) 합으로 돌아간다.
      if(found && visible){
        var hcEl = el.querySelector('.headcount-line');
        if(hcEl) hcEl.outerHTML = itemHeadcountHtml(found.item, found.kind);
        filteredDeco += itemDecoTotal(found.item);
        if(found.kind !== 'special') filteredWait += itemWaitTotal(found.item);
      }
    });
    var locs = main.querySelectorAll('details.loc');
    locs.forEach(function(loc){
      var visible = loc.querySelectorAll('.item:not([style*="display: none"])').length;
      if(anyFilterActive){
        loc.style.display = visible ? '' : 'none';
        if(visible) loc.open = true;
      } else {
        loc.style.display = '';
      }
      if(visible){
        matchedGroupCount++;
        var group = groupsFor(loc.getAttribute('data-kind')).find(function(g){ return String(g.id) === loc.getAttribute('data-group-id'); });
        if(group){
          var locHcEl = loc.querySelector('summary > .headcount-line');
          if(locHcEl) locHcEl.outerHTML = groupHeadcountHtml(group, loc.getAttribute('data-kind'));
        }
      }
    });
    // 검색어든 미완료만이든 뭔가 필터가 걸려 있으면, 헤더의 "총 보유 피크민"과
    // 같은 형식으로 지금 걸러진 결과의 카테고리 수·마릿수를 같이 보여준다
    var infoEl = document.getElementById('searchResultInfo');
    if(infoEl){
      if(anyFilterActive){
        infoEl.style.display = '';
        infoEl.textContent = matchedGroupCount + '개 카테고리 검색됨 · 필터링된 피크민 ' +
          (filteredDeco+filteredWait) + '마리 (데코 ' + filteredDeco + ' + 대기 ' + filteredWait + ')';
      } else {
        infoEl.style.display = 'none';
      }
    }
  }

  function refreshChip(key){
    document.querySelectorAll('.chip[data-key="' + CSS.escape(key) + '"]').forEach(function(chip){
      var n = getCount(key);
      var color = key.split('::')[1];
      var goal = CATALOG.goal;
      var meta = colorMeta(color);
      var owned = n>0, cleared = n>=1, met = n>=goal;
      chip.classList.toggle('owned', owned);
      chip.classList.toggle('cleared', cleared);
      chip.classList.toggle('met', met);
      var pct = Math.min(n/goal,1);
      var bg = 'color-mix(in srgb, ' + meta.hex + ' ' + Math.round(10+pct*80) + '%, var(--chip-off))';
      chip.querySelector('.inner').style.background = owned ? bg : 'var(--chip-off)';
      chip.querySelector('.n').textContent = n + '/' + goal;
      var minusBtn = chip.querySelector('.chip-minus');
      if(owned && !minusBtn){
        minusBtn = document.createElement('button');
        minusBtn.className = 'chip-minus';
        minusBtn.setAttribute('data-key', key);
        minusBtn.textContent = '−';
        chip.insertBefore(minusBtn, chip.firstChild);
      } else if(!owned && minusBtn){
        minusBtn.remove();
      }
    });
  }

  // 칩 전체의 표시 순서(색상 구분 없이)를 바꾼다 - 마작패처럼 실물 패 순서가 색상별로
  // 뭉쳐있지 않을 때, 원하는 순서 그대로 나열할 수 있게 한다. 실제 마릿수 기록은
  // 색상(+알 번호)에 그대로 묶여 있고, item.comboOrder(칩 표시 순서만 담은 배열)만
  // 바뀐다 - 값을 맞바꾸는 게 아니라 "이 칩을 어디에 보여줄지"만 바꾸는 것.
  document.getElementById('main').addEventListener('click', function(e){
    var btn = e.target.closest('.chipMoveBtn');
    if(!btn || btn.disabled) return;
    var itemId = btn.getAttribute('data-item-id');
    var pos = parseInt(btn.getAttribute('data-pos'), 10);
    var otherPos = pos + parseInt(btn.getAttribute('data-dir'), 10);
    var found = findItemAndList(itemId);
    if(!found) return;
    var item = found.item;
    var combos = itemCombos(item);
    if(otherPos < 0 || otherPos >= combos.length) return;
    var tokens = combos.map(comboToken);
    var tmp = tokens[pos]; tokens[pos] = tokens[otherPos]; tokens[otherPos] = tmp;
    item.comboOrder = tokens;
    saveCatalog();
    render();
  });

  document.getElementById('main').addEventListener('click', function(e){
    var minusBtn = e.target.closest('.chip-minus');
    var plusBtn = e.target.closest('.chip-plus');
    if(!minusBtn && !plusBtn) return;
    var target = minusBtn || plusBtn;
    var chip = target.closest('.chip');
    var key = target.getAttribute('data-key');
    var clickedColor = key.split('::')[1];
    setCount(key, getCount(key) + (minusBtn ? -1 : 1));

    var itemEl = chip.closest('.item');
    var id = itemEl.getAttribute('data-item-id');
    var found0 = findItemAndList(id);
    var item = found0 ? found0.item : null;

    if(item && item.isRare && found0.kind === 'loc'){
      // 희귀 데코는 같은 이름의 일반 데코와 마릿수가 연동된다(한쪽이 늘면 한쪽이 줄고).
      // 포인트는 여기서 정산하지 않는다 - 희귀 피크민이 생기는 것 자체는 포인트를
      // 만들어내지 않고, 그 카테고리의 "대기→데코" 성장이 포인트를 만든다.
      var pair = findRarePair(item, found0.group);
      if(pair){
        var pkey = primaryComboKeyFor(pair, clickedColor);
        setCount(pkey, getCount(pkey) + (minusBtn ? 1 : -1));
      }
      render();
      return;
    }

    if(item && found0.kind === 'loc' && !item.isRare){
      // 색상 칩을 등록하면 대기 중이던 피크민 하나가 데코로 자란 걸로 보고 대기 수를
      // 그만큼 줄인다(0 밑으로는 안 내려감 - 큰 모종으로 대기 없이 바로 데코가 된
      // 경우엔 그냥 무시됨). 등록을 취소하면 다시 대기로 돌려놓는다.
      var w = getWait(item.id, clickedColor);
      if(minusBtn){
        setWait(item.id, clickedColor, w + 1);
      } else if(w > 0){
        setWait(item.id, clickedColor, w - 1);
      }
      saveWaitState();
      var waitBtnEl = itemEl.querySelector('.waitItemBtn');
      if(waitBtnEl){
        var newWaitTotal = itemWaitTotal(item);
        waitBtnEl.textContent = '🥚' + (newWaitTotal>0 ? newWaitTotal : '');
      }
      // 카테고리에 희귀 시스템이 해금돼 있으면, 희귀 짝 유무와 상관없이 "대기→데코"로
      // 자란 모든 등록이 포인트를 만든다(희귀와 상응하는 종류가 아니어도 마찬가지).
      if(groupHasRare(found0.group) && isRareUnlocked(found0.group)){
        setRarePoints(found0.group, getRarePoints(found0.group) + (minusBtn ? -RARE_POINT_PER_UNIT : RARE_POINT_PER_UNIT));
      }
    }
    refreshChip(key);
    if(item){
      var combos = itemCombos(item);
      var owned=0, met=true;
      combos.forEach(function(cb){ var n=getCount(cb.key); if(n>=1) owned++; if(n<CATALOG.goal) met=false; });
      var complete = combos.length>0 && owned>=combos.length;
      itemEl.classList.toggle('complete', complete);
      itemEl.classList.toggle('goalmet', met && combos.length>0);
      itemEl.setAttribute('data-complete', complete?'1':'0');
      var itemHcEl = itemEl.querySelector('.headcount-line');
      if(itemHcEl) itemHcEl.outerHTML = itemHeadcountHtml(item, found0.kind);
    }
    var locEl = chip.closest('details.loc');
    if(locEl){
      var loId = locEl.getAttribute('data-group-id');
      var loKind = locEl.getAttribute('data-kind');
      var loc = groupsFor(loKind).find(function(l){ return String(l.id)===loId; });
      var locHcEl = locEl.querySelector('summary > .headcount-line');
      if(locHcEl) locHcEl.outerHTML = groupHeadcountHtml(loc, loKind);
      var gap = groupClearGap(loc);
      var lOwned = gap.owned, lTotal = gap.total, lMet=0, lGoalTotal=0;
      loc.items.forEach(function(it){ if(it.optional) return; itemCombos(it).forEach(function(cb){
        var n = getCount(cb.key);
        lMet += (n>=CATALOG.goal ? 1 : 0); lGoalTotal += 1;
      }); });
      locEl.querySelector('.loc-count').textContent = lOwned + '/' + lTotal;
      var pct = lTotal? Math.round(lOwned/lTotal*100):0;
      locEl.querySelector('.loc-progress > div').style.width = pct + '%';
      var lComplete = lTotal>0 && lOwned>=lTotal;
      var lGoalComplete = lGoalTotal>0 && lMet>=lGoalTotal;
      locEl.classList.toggle('loc-complete', lComplete);
      locEl.classList.toggle('loc-goalmet', lGoalComplete);
      var badgeEl = locEl.querySelector('summary .loc-title > .loc-badge.completion-badge');
      if(badgeEl) badgeEl.remove();
      if(lGoalComplete || lComplete){
        var span = document.createElement('span');
        span.className = 'loc-badge completion-badge' + (lGoalComplete ? ' gold' : '');
        span.title = lGoalComplete ? '전 조합 5마리 달성' : '전 종류 보유';
        span.textContent = lGoalComplete ? '🏅' : '✅';
        locEl.querySelector('.loc-title').appendChild(span);
      }
      var almostEl = locEl.querySelector('summary .loc-almost');
      if(almostEl) almostEl.remove();
      if(loKind === 'loc' && gap.missing){
        var wrap = document.createElement('div');
        wrap.innerHTML = almostBannerHtml(gap.missing);
        locEl.querySelector('summary').insertBefore(wrap.firstChild, locEl.querySelector('.loc-progress'));
      }
      // 일반 데코 완성/대기 마릿수 변화로 희귀 레벨 배지(잔여 포인트·예상 레벨)가
      // 바뀌었을 수 있으니 다시 그린다
      var rareEl = locEl.querySelector('summary .loc-title > .rare-badge');
      if(rareEl) rareEl.remove();
      if(loKind === 'loc' && groupHasRare(loc) && isRareUnlocked(loc)){
        var rwrap = document.createElement('div');
        rwrap.innerHTML = rareBadgeHtml(loc);
        var rbtn = rwrap.firstChild;
        rbtn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          openRarePointsModal(loc);
        });
        locEl.querySelector('.loc-title').appendChild(rbtn);
      }
    }
    if(onlyIncomplete) applyFilters();
    updateHeader();
  });

  document.getElementById('main').addEventListener('contextmenu', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    e.preventDefault();
  });
  var pressTimer = null;
  document.getElementById('main').addEventListener('touchstart', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    pressTimer = setTimeout(function(){ promptExact(chip); pressTimer = null; }, 550);
  }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(function(ev){
    document.getElementById('main').addEventListener(ev, function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } });
  });
  var mouseTimer = null;
  document.getElementById('main').addEventListener('mousedown', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    mouseTimer = setTimeout(function(){ promptExact(chip); mouseTimer=null; }, 550);
  });
  ['mouseup','mouseleave'].forEach(function(ev){
    document.getElementById('main').addEventListener(ev, function(){ if(mouseTimer){ clearTimeout(mouseTimer); mouseTimer=null; } });
  });
  function promptExact(chip){
    var key = chip.getAttribute('data-key');
    var cur = getCount(key);
    var goal = CATALOG.goal;
    var val = window.prompt('보유 마릿수를 입력하세요 (5세트 목표 ' + goal + '마리)', String(cur));
    if(val === null) return;
    var n = parseInt(val, 10);
    if(isNaN(n) || n < 0) return;
    setCount(key, n);
    refreshChip(key);
    render();
  }

  document.getElementById('editToggle').addEventListener('click', function(){
    editMode = !editMode;
    render();
  });
  function switchTab(tab, btn){
    curTab = tab;
    ['tabLoc','tabSpecial','tabDashboard'].forEach(function(id){
      document.getElementById(id).classList.toggle('active', document.getElementById(id) === btn);
    });
    render();
  }
  document.getElementById('tabLoc').addEventListener('click', function(){ switchTab('loc', this); });
  document.getElementById('tabSpecial').addEventListener('click', function(){ switchTab('special', this); });
  document.getElementById('tabDashboard').addEventListener('click', function(){ switchTab('dashboard', this); });
  document.getElementById('search').addEventListener('input', function(){
    // 대소문자는 매칭 시 내부에서 처리하고, 연산자(&;!()=)는 원문 그대로 유지해야
    // 하니 여기서는 앞뒤 공백만 정리한다.
    searchTerm = this.value.trim();
    applyFilters();
  });
  document.getElementById('filterBtn').addEventListener('click', function(){
    onlyIncomplete = !onlyIncomplete;
    this.classList.toggle('on', onlyIncomplete);
    applyFilters();
  });
  document.getElementById('expandBtn').addEventListener('click', function(){
    allOpen = !allOpen;
    this.textContent = allOpen ? '모두 접기' : '모두 펼치기';
    document.querySelectorAll('details.loc').forEach(function(d){ d.open = allOpen; });
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var payload = {savedAt: new Date().toISOString(), catalog: CATALOG, state: state, wait: waitState};
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = '피크민데코_백업_' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  });

  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var incomingState = data.state || data;
        var incomingCatalog = data.catalog || null;
        var incomingWait = data.wait || null;
        var msg = '가져온 데이터로 현재 진행 상황을' + (incomingCatalog ? '(카탈로그 포함) ' : ' ') +
          '덮어쓸까요?\n(' + (data.savedAt || '알 수 없는 시각') + ' 백업)';
        if(!confirm(msg)) return;
        state = incomingState;
        if(incomingWait) waitState = incomingWait;
        if(incomingCatalog) CATALOG = incomingCatalog;
        // migrate an older backup's flat/lumped special data into per-deco categories
        if(!CATALOG.specialGroups){
          CATALOG.specialGroups = regroupSpecialByName(CATALOG.special || []);
        } else if(CATALOG.specialGroups.length === 1 && CATALOG.specialGroups[0].id === 'sg-1' && CATALOG.specialGroups[0].name === '스페셜'){
          CATALOG.specialGroups = regroupSpecialByName(CATALOG.specialGroups[0].items);
        }
        if(!CATALOG.goal) CATALOG.goal = 5;
        if(!CATALOG.colors) CATALOG.colors = deepClone(DEFAULT_CATALOG.colors);
        // 예전(색상별 전역) 대기 피크민 기록은 새 구조와 호환되지 않아 정리한다
        Object.keys(state).forEach(function(k){ if(k.indexOf('waiting::')===0) delete state[k]; });
        migrateSplitColorCombos();
        stripCatalogImages();
        saveState(); saveCatalog(); saveWaitState();
        render();
        alert('가져오기를 완료했어요.');
      }catch(err){
        alert('가져오기에 실패했어요: ' + err.message + '\n(올바른 백업 JSON 파일인지 확인해주세요)');
      }
    };
    reader.onerror = function(){
      alert('파일을 읽는 중 오류가 발생했어요. iCloud에서 파일이 아직 다운로드 중이면 잠시 후 다시 시도해주세요.');
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('모든 수집 기록을 초기화할까요? 이 작업은 되돌릴 수 없습니다. (아이템/색상 구성은 유지됩니다)')) return;
    state = {};
    saveState();
    render();
  });

  render();
})();
</script>
</body>
</html>
